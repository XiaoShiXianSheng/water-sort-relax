<style>
/* 兼容性要点（最保守写法，任何宿主都能显示）：
   1) 不用 inset、不用 position:fixed —— 这两种在“忽略 viewport meta 的宿主”上
      会让画布按布局宽度(典型 980px)溢出屏幕，只看到左上角一块深色，看起来像白屏
   2) 画布的【显示尺寸】由 CSS 的 100%×100% 决定：永远跟随 body，绝不溢出
   3) JS 只负责设置画布的【位图分辨率】(width/height 属性) 与缩放比例
   4) 仅当 CSS 尺寸完全拿不到时，才用行内像素兜底（防 body 塌陷为 0） */
html{width:100%;height:100%;margin:0;padding:0;background:linear-gradient(180deg,#dbeefb,#7d5633);
  /* V6.4.9: iPhone 刘海/底部横条 —— 把安全区写进 CSS 变量供 JS 读取 */
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);}
body{margin:0;padding:0;width:100%;height:100%;min-height:100dvh;min-height:-webkit-fill-available;
     background:linear-gradient(180deg,#dbeefb,#7d5633);overflow:hidden;
     touch-action:none;overscroll-behavior:none;
     -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
#game{display:block;position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(180deg,#dbeefb,#7d5633);}
</style>
</head>

<script>
(function(){
'use strict';
/* ================= 基础 ================= */

/* ================= 真机诊断（避免"白屏但查不出原因"） ================= */
function diagText(){

    +'\n视口 inner='+(window.innerWidth||0)+'×'+(window.innerHeight||0)
    +'\ndocEl='+(de?(de.clientWidth+'×'+de.clientHeight):'无')
    +'\nbody='+(bd?(bd.clientWidth+'×'+bd.clientHeight):'无')
    +'\ncanvas 显示尺寸='+(c.clientWidth||0)+'×'+(c.clientHeight||0)
    +'\ncanvas 位图='+(c.width||0)+'×'+(c.height||0)
    +'\ndpr='+(window.devicePixelRatio||1)
    +'\nvisualViewport='+(vv?(vv.width+'×'+vv.height):'无')
    +'\n[画布显示尺寸='+lastSize.cw+'×'+lastSize.ch+' 已成功渲染='+(renderedOk?'是':'否')+']';
}
function showFatal(msg){
  try{
    var el=document.getElementById('__fatal');
    if(!el){
      el=document.createElement('div');
      el.id='__fatal';
      el.setAttribute('style','position:absolute;left:0;top:0;right:0;z-index:99999;background:#fff;color:#c00;font:12px/1.5 monospace;padding:8px;white-space:pre-wrap;max-height:70%;overflow:auto');
      (document.body||document.documentElement).appendChild(el);
    }
    el.textContent='【诊断 / 运行出错，请截图反馈】\n'+msg;
  }catch(e){}
}
window.onerror=function(m,s,l,c,e){if(!fatalShown){fatalShown=true;showFatal((e&&e.stack)||(m+' @'+l+':'+c));}return false;};
window.addEventListener('unhandledrejection',function(e){if(!fatalShown){fatalShown=true;showFatal('PROMISE '+((e.reason&&e.reason.stack)||e.reason));}});
/* V6.1：调色板 20 色（实际用到 17，SLOT_CAP=17 决定，留 3 个余量）。
   选色标准：先按色相环均匀铺开（红→蓝→绿→橙→紫→粉→青→黄绿），
   再用「明度差」补足同色相区域。V6.0 的问题：后期深紫#4b2e83/深绿#1f9d55/深红#7a1f1f
   与早期基础紫#9b6bf5/绿#3ec46d/红#ff5d6c 明度太近，17 色同屏时肉眼分不清。
   V6.1 改法（颜色只是标签，重排不影响可解性逻辑）：
     · 主动色 0~12 保持不变（早期关卡就常驻的基础色相）；
     · 后期极端明度组 13~16 改成「黑 / 白 / 深红 / 深藏青」四个与基础色拉开明度的锚点：
       黑#2b2b33（L≈18%）、纯白#ffffff（L≈100%，替代旧冰白#f2f2f2——在半透明白瓶身上更跳）、
       深红#7a1f1f（L≈30%，远离亮红 L68%）、深藏青#0d2b6b（L≈22%，远离亮蓝 L62%）；
     · 旧的近邻深色（灰蓝/深紫/深绿）下沉到 17~19 号作余量，不再进入 17 色实战池 ——
       等于直接把「深蓝vs蓝、深紫vs紫、深绿vs绿」的混淆对从实战里拿掉。
   配色自检：黑#2b2b33 与灰蓝#7f8c99(L60%) 明度差充足；纯白#ffffff 与木托盘/瓶底也不会糊。 */
var COLORS=['#ff5d6c','#3f8cff','#3ec46d','#ffb648','#9b6bf5','#ff85c2',
            '#29c7d6','#c6d92e','#ff7a1a','#8b5e3c','#00a0a0','#b0308f',
            '#f2e34c','#2b2b33','#ffffff','#7a1f1f','#0d2b6b',
            '#7f8c99','#4b2e83','#1f9d55'];
/* V6.4.4 颜色中文名（供道具提示文案用）：只报色号玩家看不懂，必须说人话。 */
var COLNAMES=['红','蓝','绿','橙','紫','粉','青','黄','橘棕','棕','墨绿','玫红','浅黄','黑','白','暗红','藏青','灰蓝','深紫','深绿'];
function colName(c){try{return COLNAMES[c]||('第'+(c+1)+'色');}catch(e){return '这';}}
/* 颜色集选取（V6.2.4）：从 L10 起强制黑(#2b2b33,13)+白(#ffffff,14)必在，其余从调色板前段补足；
   低关(L1-9)保持 0..C-1 原顺序（新手用易分辨基础色）。灰(#7f8c99,17)本次不提前。 */
function pickColorSet(C, lv){
  if(lv>=10){
    var s=[13,14], i=0;
    while(s.length<C && i<COLORS.length){ if(i!==13 && i!==14) s.push(i); i++; }
    return s;
  }
  var s2=[]; for(var k=0;k<C;k++) s2.push(k); return s2;
}
var URL_LVL=0;
try{ var _m=((window.location&&window.location.search)||'').match(/[?&]lvl=(\d+)/); URL_LVL=_m?parseInt(_m[1],10)||0:0; }catch(e){}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}
function hex2rgb(h){var n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function light(h,k){var a=hex2rgb(h);return 'rgb('+Math.round(a[0]+(255-a[0])*k)+','+Math.round(a[1]+(255-a[1])*k)+','+Math.round(a[2]+(255-a[2])*k)+')';}
function dark(h,k){var a=hex2rgb(h);return 'rgb('+Math.round(a[0]*(1-k))+','+Math.round(a[1]*(1-k))+','+Math.round(a[2]*(1-k))+')';}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
var FONT='"Segoe UI","Microsoft YaHei",sans-serif';

/* ================= 音效 ================= */
var AC=null;
function ac(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(freq,dur,type,vol,slideTo,delay){var a=ac();if(!a)return;try{var t0=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);g.gain.setValueAtTime(vol||0.05,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.03);}catch(e){}}
var SFX={
  tap:function(){tone(560,0.07,'sine',0.06,760);},
  place:function(){tone(300,0.1,'sine',0.07,420);tone(520,0.08,'sine',0.05,null,0.08);},
  cap:function(){tone(880,0.09,'sine',0.07,1320);},
  pour:function(){tone(260,0.3,'sine',0.06,130);},
  gulp:function(){tone(420,0.08,'sine',0.05,560);},
  done:function(){tone(523,0.12,'sine',0.08);tone(659,0.12,'sine',0.08,null,0.09);tone(784,0.22,'sine',0.08,null,0.18);tone(1047,0.18,'sine',0.06,null,0.3);},
  win:function(){tone(523,0.14,'sine',0.09);tone(659,0.14,'sine',0.09,null,0.13);tone(784,0.14,'sine',0.09,null,0.26);tone(1047,0.4,'sine',0.1,null,0.39);},
  magic:function(){tone(720,0.18,'sine',0.06,180);tone(1100,0.12,'sine',0.04,400,0.05);},
  no:function(){tone(170,0.12,'square',0.045,130);},
  undo:function(){tone(400,0.1,'sine',0.05,260);}
};

/* ================= 布局常量 ================= */
var UH=36;            // 水层单元高（上限；高关卡水量大时会自动变薄，见 G.uh；下限 28，再薄就难看）
var BOTT_Y=470;       // 水管底部基准线（底对齐；水多时向上溢出屏幕顶部）
var TUBE_CUT_Y=110;   // 水柱顶到这条线以上 = 顶部出画面：管口改平口，超出部分交给顶部渐隐
var TUBE_FADE_H=160;  // 顶部渐隐遮罩的高度（0 → 160 由不透明渐变到全透明）
var TUBE_W=92; // 兼容保留（实际用 G.tubeW）
var TUBE_GAP_MIN=6;   // 高关卡水管变多时的最小管间距（与 TUBE_MIN_W 一起决定「最多能排几根管」）
var TUBE_MIN_W=34;    // 水管最小宽度：再窄在手机上就点不准了（tubeCountFor 按它反推根数上限）
var SLOT_Y=700;       // 台面表面（瓶底）
var GRID_Y0=766;      // 底部货架起始 y（实际用 G.gridY0，会按行数垂直居中）
                      // 766 不是拍脑袋：货架瓶子的**瓶盖**画在「格子上沿上方约 17px」
                      // （瓶盖顶 = 格子上沿 + tile/2 + 11 - bh），而台面瓶子的刻度格下沿在
                      // SLOT_Y+38 = 738。766 让所有 3~5 行的组合都留出 ≥7px 空隙，
                      // 不会出现「货架瓶盖顶到台面刻度」这种层叠感。
var GX=8, GY=12;      // 货架格子间距（V6.1：GX 10→8，把省下的横向空间让给格子本身，配合 11 列铺满屏幕）
var GRID_ROWS=3;      // 货架固定 3 行（列数按瓶子数自算）
var TOOL_Y=1176, TOOL_H=96, TOOL_W=130, TOOL_GAP=10, TOOL_X0=85;   // 4 个按钮居中（去掉假分享后重新居中）
var TOOLBS=[
  {id:'clear', label:'魔法清除', icon:'✨'},
  {id:'finger',label:'万能指',  icon:'👆'},
  {id:'swap',  label:'随心互换', icon:'🔄'},
  {id:'undo',  label:'撤销',     icon:'↩'}
  /* 「分享」按钮已删除：V4.0 §15 禁止保留「点击即奖励」的假分享（没有真正调用系统分享）。
     真要分享，应走平台真实分享能力（TapTap 分享需服务端模板审核），不属于 V1 范围。 */
];
function toolX(i){return TOOL_X0+i*(TOOL_W+TOOL_GAP);}

/* ================= 商业基础设施：配置 / 存档 / 埋点 / 广告服务 =================
   对应 WorkBuddy 最终开发提示词 V4.0：§4(TEST≠无广告设计) §14(AdService) §16(存档) §21(埋点)
   原则：
   ① 游戏业务代码不直连任何平台 SDK —— 一律经 AdService，换平台不改游戏逻辑；
   ② TEST / ONLINE 一键切换，只改配置不改游戏逻辑；
   ③ 存档带校验和，损坏 / 版本升级 / 隐私模式配额满 → 一律回退安全初始状态，绝不白屏；
   ④ 埋点全部 try/catch 包裹，埋点失败绝不影响游戏。

   广告 SDK 选型（已核对 TapTap 官方文档，本机 2026-09-27）：
     · 官方口径：广告变现能力支持「星火 / H5 小游戏 / TapTap 制造」；
       Tap 小游戏与 APK 才需要接 Dirichlet 广告联盟。本项目是 H5 小游戏 → 走官方 tap.* 接口。
     · 激励视频：var ad=tap.createRewardedVideoAd({adUnitId:'xxx'});
                 ad.show()（返回 Promise，未加载完会 reject → 需 ad.load() 后重试）；
                 ad.onClose(function(res){ if(res&&res.isEnded){发奖} else {不发奖} });  ← 只有 isEnded 才发
     · 插屏：var it=tap.createInterstitialAd({adUnitId:'xxx'}); it.show();
     · tap 是平台运行时注入的全局对象，不需要引入任何第三方 SDK 脚本 —— 所以本文件仍是零外部依赖。
     · 官方建议：插屏展示间隔 ≥2~3 分钟、限制单会话次数（本项目取 5 分钟 / 1 次，更克制）。
   adUnitId 为空时（尚未在开发者中心开通广告）会自动降级为 TEST，流程绝不被卡死。 */

var CFG={
  version:'6.4.17',                        // 对外版本号：随每条埋点上报，出事时能区分线上跑的是哪一版
  maxLevel:90,                             // 关卡总数上限：完整内容就是 90 关；过关推进/选关页数/起点读取都以此为准，杜绝溢出到 91+
  env:'online',                            // 'online'(正式通道：真机有 tap 就真实拉广告) | 'test'(模拟完成) —— 另见 mockSdk 的第三态
                                           // 自动降级：无 window.tap → test(no-tap-runtime)；无 adUnitId → test(no-ad-unit-id)。
                                           // 所以本地浏览器/Node 测试环境永远是 test，真机永远走 online，不需要手动改代码。
  adUnit:{rewarded:'1068017',interstitial:'1068090'},  // 广告位ID：在 Dirichlet 媒体平台 ssp.dirichlet.cn 创建；留空则自动降级 TEST
                                           // ★ V6.4.5：两条位都从【测试媒体 1110240】迁到【正式媒体 1110498】(MEDIA_TYPE_FORMAL)。
                                           //   1068017 = 正式媒体下的激励视频(SCENE_TYPE_REWARD)；1068090 = 正式媒体下的插屏(SCENE_TYPE_INSERT)。
                                           //   旧位 1067564/1067565 挂在测试媒体下 → 只有白名单设备能拉到广告，真机收益恒为 0。
  /* ★ adUnitIsTest —— 这一行决定「有没有真钱进账」，改它之前先读完这段。
     Dirichlet 后台的推广位有「测试 / 正式」两种属性，区别不是名字，是**谁能看到广告**：
       · 属性=测试 → 只有你在后台【测试工具】里加过的白名单设备能拉到广告，
                     其它真机拉广告**必失败**（游戏照常玩，不报错）→ 真机真实收益 = 0。
       · 属性=正式 → 全部用户能拉到广告，才会计费。
     V6.4.0 起这一行**不再手填**：默认 false（正式位），启动时按运行环境自动落位 ——
       真机 TapTap 容器（有 window.tap）→ 正式位，埋点 src=formal-unit；
       普通浏览器 / 无 SDK            → 测试位，埋点 src=test-unit（本来也拉不到广告）。
     ?adunit=formal / ?adunit=test 可强制覆盖，供真机验收与自动化断言。
     ⚠️ 它只影响埋点与调试面板的 src 字段，**不改变任何降级逻辑** ——
        拉不拉得到广告永远由后台推广位属性决定，代码改不出钱来。 */
  adUnitIsTest:false,
  /* V6.4.4 契约 mock SDK 开关：测试环境要不要「模拟线上正式通道」。(默认 false，只由 ?mock=1 或面板第三格打开)
     ★ 为什么必须有（2026-10-04 用户拍的）：以前 AdService.init() 里「没 window.tap 就一刀切打回 test」，
       导致任何非 TapTap 容器环境（浏览器/微信/测试机）点 ONLINE 都被弹回 TEST ——
       正式分支的代码（adUnitId 取值 / 会话上限 / 冷却 / isEnded 判定 / 发奖 / 平台选位）**永远跑不到**，
       只能等上线后才炸。这就是「bug 都在线上才体现」的根。
     mockSdk=true 时：走完整正式通道（真的调 createRewardedVideoAd -> onLoad -> show -> onClose(isEnded) -> 发奖），
     只是底下那一层 SDK 是契约 mock，广告素材不是真的。埋点一律带 sdk:'mock'，绝不冒充真机。 */
  mockSdk:false,
  dumpTrack:false,                          // ?dump=1：主循环每秒把埋点缓冲渲染成纯文本（可框选复制）
  /* V6.4.1 平台维度与「强制真 SDK」开关（结论见 adUnitFor 处说明）。
     平台只用来选 adUnitId 与给埋点打标，**不改变任何降级逻辑**。 */
  platform:'unknown',                     // UA 探测：'ios' | 'android' | 'unknown'
  adUnitByPlatform:{ios:{rewarded:'',interstitial:''},android:{rewarded:'',interstitial:''}},
  /* adUnitFor(type)：按平台取广告位 ID；byPlatform 为空时退回通用 ID —— 也就是一套 ID 双端通用。
     2026-10-04 核验：TapTap 小游戏 iOS / 安卓共用同一个 window.tap 与同一套 ad API（官方「小游戏介绍」
     明写小游戏在 iOS 端有独立曝光专区），所以代码**不需要**双份 adUnitId；
     「只有安卓位」是后台把媒体建成 应用类型=应用 / 系统=Android 造成的，不是平台不支持 iOS。
     哪天后台真给到 iOS 专用位，把 ID 填进 adUnitByPlatform.ios 即可，游戏逻辑零改动。 */
  adUnitFor:function(type){
    var u=CFG.adUnitByPlatform&&CFG.adUnitByPlatform[CFG.platform];
    if(u&&u[type]&&u[type])return u[type];
    return (CFG.adUnit&&CFG.adUnit[type])||'';
  },
  /* V6.4.1 道具额度按环境口径区分：正式 1/1/1，测试模式放宽到 9/9/9。
     ★ 只改「初始余额」，玩法判定一行没动 —— 通关条件 / 水量守恒只看 G.tubes、G.bottles，
       不看 G.tools 是多少，所以测试环境道具无限也绝不会造成通关判定异常。
     严格模式保持上面 adUnitIsTest 之后的原始字面，回归套件与回滚锚点那串字面必须还在，
     所以这里只做**叠加**（R8），不替换原行。 */
  toolMode:'strict',                      // 'strict'(正式额度 1/1/1) | 'loose'(测试额度 9/9/9)
  toolQuota:{strict:{clear:0,finger:0,swap:0,undo:1},loose:{clear:9,finger:9,swap:9,undo:9}},
  toolResetEach:false,  // 连点面板可切：true=每关补满0-0-0-1；false=额度跨关持久(用完看广告补)
  rewardedSessionCap:12,                   // V6.4.6：单会话激励视频上限（原 3，看满就永久哑火 → 变现被自己锁死）
  adUnlockCap:2,                           // V6.4.6：每关「看广告解锁台面槽」的上限（免费那 1 次不算在内）
  interstitialSessionCap:1,                // 单会话插屏上限
  interstitialCooldown:300,                // 插屏冷却（秒）：官方建议 ≥180s，这里取 300s 更克制
  firstSessionProtection:15,               // 首次体验保护（秒）：进入后这段时间不主动弹插屏
  interstitialAfterWins:3,                 // 连续成功 3 次后才允许一次插屏（低频、可关闭）
  reviveLimit:2,                           // 每局广告复活次数上限
  adFailFallback:'free',                   // 广告拉取失败降级：'free'(放行一次救援，不卡流程) | 'none'(只提示)
  trackUrl:'',                             // 埋点上报地址（留空 = 只写本地缓冲，便于离线核对）
  trackLocalCap:80,                        // 本地最多保留多少条事件

  /* ---------- V6.0 §五-A：回归热身 + 递进挑战（留存机制，不是降难度开关） ----------
     要解决的问题：玩家隔一段时间回来，直接撞上自己上次的最高难度 → 被劝退。
     做法：**保留关卡进度不动**，只在「本次挑战」这一层从低难度档位重新起步，
     连续成功后在同一关内逐档把难度加回去。
     口径上的硬区分（测试第 7 条要验的就是这个）：
       · 关卡进度（Store.level / Store.data.maxLevel）—— 只增不减，热身绝不碰它；
       · 本次挑战档位（Store.data.warmTier）—— 可以低于 0，是「这一局重开在哪个档」。
     全部参数化：改默认值不需要动玩法代码，「几天」也不写死（阈值按秒算）。 */
  returnWarmupEnabled:true,                // 总开关；关掉后行为与 V4.0 完全一致
  returnWarmupInactivityThreshold:12*3600, // 多久没打开算「一段时间的回归用户」（秒；默认 12 小时）
  returnWarmupStartTier:-2,                // 回归后本次挑战从哪一档起步（-2 = 热身1，比正常档低两档）
  returnWarmupRampStep:1                   // 每次成功后难度回升几档（回到 0 = 正常档即结束热身）
};
try{
  // ?ad=online / ?env=online 可强制线上环境（真机验证用）；?ad=test 强制测试环境
  var _q=(window.location&&window.location.search)||'';
  if(/[?&](ad|env)=online/.test(_q))CFG.env='online';
  if(/[?&](ad|env)=test/.test(_q))CFG.env='test';
  /* V6.4.0：广告位属性按运行环境自动落位（见 CFG.adUnitIsTest 处的说明）。
     有 SDK 的真机走正式位；无 SDK 的浏览器退回测试位。URL 可强制覆盖。 */
  var _hasTap=false; try{ _hasTap=!!(window.tap&&window.tap.createRewardedVideoAd); }catch(e2){}
  CFG.adUnitIsTest=!_hasTap;
  if(/[?&]adunit=formal/.test(_q))CFG.adUnitIsTest=false;
  if(/[?&]adunit=test/.test(_q))CFG.adUnitIsTest=true;
  /* V6.4.1 平台探测（UA）：只为选 adUnitId 与埋点打标，不影响任何降级逻辑。
     iPadOS 13+ 的 UA 会伪造成 Macintosh，所以 iPad 优先按 ios 判；?platform=ios|android 可强制。 */
  var _ua=''; try{ _ua=String((window.navigator&&window.navigator.userAgent)||''); }catch(e){}
  CFG.platform=(/(iphone|ipad|ipod)/i.test(_ua))?'ios':((/android/i.test(_ua))?'android':'unknown');
  var _pm=/(?:^|[?&])platform=(ios|android)/.exec(_q); if(_pm)CFG.platform=_pm[1];
  /* ★ 强制真 SDK 模式 ?sdk=real —— 把「切正式环境」从改个字符串变成一条可观测、可断言的通路。
     打开后：有 window.tap → 走真实 SDK 全链路；没有 tap → **明确报 no-real-runtime 且拒绝发奖**，
     绝不走模拟发奖。这样真机验收时「没弹出来」和「弹出来了」在埋点里一眼可分，不会出现假绿。 */
  /* C：旧写法 /(?:^[?&])sdk=real/ 只在 sdk 是第一个参数时才命中（?sdk=real 可以，
     ?lvl=5&sdk=real 不行）—— 与上面 adunit 的 /[?&]adunit=formal/ 写法对齐。 */
  CFG.forceRealSdk=/[?&]sdk=real/.test(_q);
  /* V6.4.4 ?mock=1 / ?sdk=mock：开契约 mock SDK，直接进 ONLINE 正式通道。
     只在 URL 显式开，绝不自测生效 —— 普通玩家 / 审核员不可能误触。 */
  if(/[?&](?:mock|sdk)=mock/.test(_q)){ CFG.mockSdk=true; CFG.env='online'; }
  /* V6.4.4 ?dump=1：把埋点缓冲以纯文本铺在页面上，真机截图/复制回传，解决「线上跑出来的问题我看不见」。 */
  if(/[?&]dump=1/.test(_q))CFG.dumpTrack=true;
  /* 道具额度环境口径：?env=test 或 ?tools=loose → 宽松；其余一律 strict（与线上同口径） */
  if(/[?&](ad|env)=test/.test(_q)||/[?&]tools=loose/.test(_q))CFG.toolMode='loose';
  if(/[?&]tools=strict/.test(_q))CFG.toolMode='strict';
}catch(e){}

/* ---------- 本地存档（localStorage + 校验和 + 版本迁移 + 损坏重建） ---------- */
var SAVE_KEY='wsr_save_v1', SAVE_VER=3;    // v2：V6.0 回归热身字段；v3：V6.3 三档→两档（砍困难档）归并
var Store={
  data:null,
  blank:function(){
    return {v:SAVE_VER,level:1,tiers:{},stars:{},tools:{clear:0,finger:0,swap:0},undo:1,unlockLeft:1,
            daily:{date:'',done:0,stars:0},tut:0,firstOpen:'',lastOpen:'',sessions:0,wins:0,failFallback:0,
            /* V6.0 §五-A：最高关卡 / 最近游玩时间 / 本次挑战档位 —— 三件必须分开存，
               否则「热身」与「进度」会互相污染（测试第 7、8 条就是验这个）。 */
            maxLevel:1,        // 最高关卡：玩家到达过的最高关，只增不减
            lastPlayed:0,      // 最近游玩时间：epoch 毫秒；改存档里任何东西都会刷新它
            warmActive:0,      // 本次会话是否处于「回归热身」
            warmTier:0,        // 本次挑战难度档位（<0 = 热身档；0 = 正常档）
            warmLevel:1,       // 热身绑定在哪一关（换关即失效，防蹭热身）
            warmWins:0};       // 热身里连续成功次数（用于逐档回升的观测与埋点）
  },
  hash:function(s){                 // djb2×33：够用且零依赖（不需要 CRC 库）
    var h=5381;
    try{ for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0; }catch(e){}
    return h;
  },
  read:function(){
    try{
      if(!window.localStorage)return null;
      var raw=window.localStorage.getItem(SAVE_KEY);
      if(!raw)return null;
      var o=JSON.parse(raw);
      if(!o||typeof o!=='object')return null;
      if(typeof o.body!=='string'||typeof o.sig!=='number')return null;
      if(Store.hash(o.body)!==o.sig)return null;        // 篡改 / 截断 → 视为无效，静默重建
      var d=JSON.parse(o.body);
      if(!d||typeof d!=='object')return null;
      return d;
    }catch(e){ return null; }
  },
  migrate:function(d){
    var b=Store.blank(),k;
    for(k in b)if(d[k]===undefined||d[k]===null)d[k]=b[k];
    if(!d.tools||typeof d.tools!=='object')d.tools=b.tools;
    if(typeof d.tools.clear!=='number')d.tools.clear=0;
    if(typeof d.tools.finger!=='number')d.tools.finger=0;
    if(typeof d.tools.swap!=='number')d.tools.swap=0;
    if(!d.daily||typeof d.daily!=='object')d.daily=b.daily;
    if(!d.stars||typeof d.stars!=='object')d.stars={};
    if(!d.tiers||typeof d.tiers!=='object')d.tiers={};
    if(!(d.level>=1))d.level=1;
    if(!(d.tut>=0))d.tut=0;
    /* V6.0：新字段的类型守卫 —— 存档被手改/被旧版本写坏时不能把游戏带崩。
       maxLevel 必须 ≥ level-1（level 是「已解锁的下一关」，maxLevel 是「到达过的最高关」）。 */
    if(!(typeof d.maxLevel==='number'&&isFinite(d.maxLevel)&&d.maxLevel>=1))d.maxLevel=d.level;
    if(d.maxLevel<d.level)d.maxLevel=d.level;
    if(!(typeof d.lastPlayed==='number'&&isFinite(d.lastPlayed)&&d.lastPlayed>=0))d.lastPlayed=0;
    if(!(typeof d.warmTier==='number'&&isFinite(d.warmTier)))d.warmTier=0;
    if(d.warmTier>0)d.warmTier=0;                       // 热身档位只允许 ≤0（>0 是玩家自己选的挑战档）
    if(!(typeof d.warmLevel==='number'&&isFinite(d.warmLevel)&&d.warmLevel>=1))d.warmLevel=d.level;
    if(!(typeof d.warmWins==='number'&&isFinite(d.warmWins)&&d.warmWins>=0))d.warmWins=0;
    d.warmActive=d.warmActive?1:0;
    /* ---- V6.3 三档→两档归并（idempotent：重复跑不丢数据）----
       旧档：tiers[lv] ∈{0,1,2}（0=普通已通/1=困难已解/2=极限已解）；
       新档：tiers[lv] ∈{0,1}（0=普通已通/1=极限已解）。
       归并口径：凡旧值 ≥1（即曾打通普通、解锁过困难的玩家）一律视为「极限已解锁」——
       玩家为打通普通付出的进度不被回退；旧值 2（本来就解锁极限）自然也是 1。
       星级：normal 保留；extreme = max(旧 hard, 旧 extreme)，旧 hard 星级并入极限档（不丢星、不刷星）。 */
    try{
      if(d.tiers){ var tk; for(tk in d.tiers){ d.tiers[tk]=(d.tiers[tk]>=1)?1:0; } }
      if(d.stars){ var sk,rr; for(sk in d.stars){ rr=d.stars[sk]; if(!rr||typeof rr!=='object')continue;
        rr.extreme=Math.max(rr.extreme||0, rr.hard||0); rr.normal=rr.normal||0; delete rr.hard; } }
      if(typeof d.warmTier!=='number')d.warmTier=0;
      if(d.warmTier>1)d.warmTier=1;                    // 热身只产生 ≤0 的负档，>1 是旧三档残留，夹回
    }catch(e){}
    d.v=SAVE_VER;                                       // 版本升级：补齐字段后统一打新版本号
    return d;
  },
  load:function(){
    var raw=Store.read();
    Store.data=Store.migrate(raw||Store.blank());
    return Store.data;
  },
  save:function(){
    try{
      if(!window.localStorage)return false;
      var body=JSON.stringify(Store.data);
      window.localStorage.setItem(SAVE_KEY,JSON.stringify({sig:Store.hash(body),body:body}));
      return true;
    }catch(e){ return false; }                          // 隐私模式 / 配额满 → 静默失败，游戏照常
  },
  set:function(k,v){ try{ Store.data[k]=v; Store.save(); }catch(e){} },
  get:function(k,def){ try{ var v=Store.data[k]; return v===undefined?def:v; }catch(e){ return def; } },
  reset:function(){ Store.data=Store.blank(); Store.save(); }
};

/* ================= V6.0 §五-A：回归热身 + 递进挑战 =================
   一句话：**进度不动，只把「这一局用什么难度」降下来，再一档一档加回去。**
   它与「关卡进度」严格分工 —— 下面所有函数都不写 Store.level / Store.data.maxLevel。

   档位取值约定（同一根数轴，负数是热身）：
     -2 热身1 ｜ -1 热身2 ｜ 0 正常 ｜ 1 困难 ｜ 2 极限
   热身只在 ≤0 的区间里爬，爬到 0 就结束（之后 1/2 档是玩家自己在结算页选的挑战档）。
*/
function nowMs(){ try{ return (new Date()).getTime(); }catch(e){ return 0; } }
function idleSeconds(){
  try{
    var last=Store.get('lastPlayed',0)||0;
    if(!(last>0))return 0;
    return Math.max(0,(nowMs()-last)/1000);
  }catch(e){ return 0; }
}
/* 本次挑战档位：只有「回归用户 + 热身仍绑在当前这一关」时才非 0。 */
function resolveChallengeTier(lv){
  try{
    if(!CFG.returnWarmupEnabled)return 0;
    var d=Store.data; if(!d||!d.warmActive)return 0;
    if((d.warmLevel|0)!==(lv|0))return 0;      // 玩家已经换关了 → 热身对它不适用
    var t=d.warmTier|0;
    if(t>0)t=0;                                // 热身只允许 ≤0
    return t;
  }catch(e){ return 0; }
}
/* 本局是否处于热身（给 UI / 埋点用） */
function inWarmup(lv){
  try{ return !!(CFG.returnWarmupEnabled&&Store.data&&Store.data.warmActive&&
    (Store.data.warmLevel|0)===(lv|0)&&(Store.data.warmTier|0)<0); }catch(e){ return false; }
}
/* 会话启动时判定「是不是回归用户」。
   ★ 已处于热身中的会话不重置档位 —— 否则每天回来都被打回最低档，热身永远走不完。 */
function warmupOnBoot(){
  try{
    var d=Store.data;
    if(!d)return null;
    var started=null;
    if(CFG.returnWarmupEnabled&&!d.warmActive){
      var idle=idleSeconds();
      if(Store.get('lastPlayed',0)>0&&idle>=CFG.returnWarmupInactivityThreshold){
        d.warmActive=1;
        d.warmTier=CFG.returnWarmupStartTier|0;
        d.warmLevel=Store.get('level',1)||1;
        d.warmWins=0;
        started={idleSec:Math.round(idle),tier:d.warmTier,level:d.warmLevel};
        Track.log('warmup_start',{idleSec:Math.round(idle),tier:d.warmTier,level:d.warmLevel});
      }
    }
    Store.set('lastPlayed',nowMs());
    return started;
  }catch(e){ return null; }
}
/* 通关一次后把热身档位往上推一档：热身1 → 热身2 → 正常（到 0 即结束热身）。
   返回新档位；不在热身里返回 null。失败不惩罚（这正是「降低回归门槛」的本意）。
   ★ 同时把热身「绑到新的一关」：热身是跟着玩家往前走的一条坡道，不是锁死在某一张图上。
     不搬 warmLevel 的话，第 15 关热完身、进度推到 16 关，resolveChallengeTier(16) 会因为
     warmLevel 还停在 15 而直接返回 0 —— 「热身1 → 热身2 → 正常」在第二关就断了。 */
function advanceWarmup(){
  try{
    var d=Store.data;
    if(!d||!d.warmActive)return null;
    d.warmWins=(d.warmWins|0)+1;
    var t=(d.warmTier|0)+(CFG.returnWarmupRampStep||1);
    if(t>=0){ t=0; d.warmActive=0; }
    d.warmTier=t;
    if(d.warmActive)d.warmLevel=(Store.get('level',d.warmLevel)|0)||d.warmLevel;
    Track.log('warmup_advance',{tier:t,warm:d.warmActive?'1':'0',wins:d.warmWins,level:d.warmLevel});
    Store.save();
    return t;
  }catch(e){ return null; }
}
/* 热身档位的人话名字（结算页/HUD 用） */
function tierLabel(t){
  t=t|0;
  if(t<=-2)return '热身1';
  if(t===-1)return '热身2';
  return TIER_NAME[t]||'普通';
}

/* ---------- 最小埋点（10+ 事件，永不抛错，绝不阻塞游戏） ---------- */
var Track={
  buf:[], t0:0,
  log:function(name,params){
    try{
      var lv=0,gt=0;
      try{ if(typeof G!=='undefined'&&G){ lv=G.level||0; gt=Math.round(G.t||0); } }catch(e0){}
      var ev={e:name,t:new Date().getTime(),gt:gt,lv:lv,v:CFG.version,p:params||{}};
      Track.buf.push(ev);
      if(Track.buf.length>240)Track.buf.shift();
      try{
        if(window.localStorage)window.localStorage.setItem('wsr_ev',JSON.stringify(Track.buf.slice(-CFG.trackLocalCap)));
      }catch(e1){}
      if(CFG.trackUrl)try{ Track.send(ev); }catch(e2){}
      return ev;
    }catch(e){ return null; }                           // 埋点永远是"尽力而为"
  },
  /* V6.4.4 ?dump=1：把本地埋点缓冲以纯文本渲染在页面上，可框选复制 / 截图回传。
     这是「真机跑出来的问题我看不见」的最小解法 —— 不依赖 trackUrl，离线也能用。 */
  dump:function(){
    try{
      if(!window.document)return;
      var pre=window.document.getElementById('wsr_dump');
      if(!pre){ pre=window.document.createElement('pre'); pre.id='wsr_dump';
        pre.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;margin:0;z-index:99999;overflow:auto;'
          +'background:rgba(0,0,0,0.86);color:#7fffaf;font:12px/1.5 Menlo,Consolas,monospace;padding:10px;white-space:pre-wrap;';
        window.document.body.appendChild(pre); }
      var raw='', arr=[];
      try{ raw=window.localStorage.getItem('wsr_ev')||''; arr=JSON.parse(raw)||[]; }catch(e){ arr=Track.buf.slice(); }
      var out=[], i;
      for(i=0;i<arr.length;i++){ var e=arr[i]; out.push('['+i+'] '+e.e+' v'+e.v+' lv'+e.lv+' gt'+e.gt+' '+JSON.stringify(e.p)); }
      pre.textContent='wsr_ev ('+arr.length+')\n'+(out.length?out.join('\n'):'(空)');
    }catch(e){}
  },
  send:function(ev){
    try{
      var payload=JSON.stringify(ev);
      if(window.navigator&&window.navigator.sendBeacon){ window.navigator.sendBeacon(CFG.trackUrl,payload); return; }
      /* 老 WebView 没有 sendBeacon 时的兜底：图片信标（GET 查询串）。
         用 Image 而不是 fetch —— 不需要 CORS 预检，也不会给「零依赖单文件」引入任何网络 API。 */
      if(window.Image){
        var u=CFG.trackUrl+(CFG.trackUrl.indexOf('?')<0?'?':'&')+'e='+encodeURIComponent(payload);
        var im=new window.Image(); im.src=u;
      }
    }catch(e){}
  },
  count:function(name,filter){
    var n=0;
    for(var i=0;i<Track.buf.length;i++){
      if(Track.buf[i].e!==name)continue;
      if(filter&&!filter(Track.buf[i]))continue;
      n++;
    }
    return n;
  },
  last:function(name){
    for(var i=Track.buf.length-1;i>=0;i--)if(Track.buf[i].e===name)return Track.buf[i];
    return null;
  },
  reset:function(){ Track.buf=[]; }
};

/* ---------- 广告服务：Game → AdService → TestAdProvider / TapTapAdProvider ---------- */
function nowSec(){ try{ return (new Date()).getTime()/1000; }catch(e){ return 0; } }
var AdService={
  env:'test', inited:false, degradeReason:'', forceRealSdk:false,
  session:{rewarded:0,inter:0,lastInter:-99999,wins:0},
  stats:{request:0,loadFail:0,show:0,complete:0,cancel:0,rewarded:0,dupBlocked:0,capBlocked:0,coolBlocked:0,fallback:0},
  /* V6.4.4 契约 mock SDK：方法签名与 window.tap 对齐（adUnitId 入参、show/load 返回 Promise-like、
     onLoad/onError/onClose 回调），onClose 以 isEnded:true 回调 —— 模拟「看完了」再加奖。
     它存在的唯一目的：让测试环境把正式分支整条跑通，而不是只把埋点字符串改一改（那是假绿）。
     calls 记下每次真实构造的 adUnitId，验收时一眼能看到「正式通道到底取到了哪个位」。 */
  mock:{calls:[],shows:0,
    createRewardedVideoAd:function(o){
      var id=(o&&o.adUnitId)||''; AdService.mock.calls.push('rewarded:'+id);
      return {adUnitId:id,
        show:function(){ AdService.mock.shows++; return {'catch':function(){}}; },
        load:function(){ return {then:function(f){ if(f)try{f();}catch(e){} return {'catch':function(){}}; },'catch':function(){}}; },
        onLoad:function(f){ setTimeout(function(){ if(f)try{f({}); }catch(e){} },0); },
        onError:function(){},
        onClose:function(f){ setTimeout(function(){ if(f)try{f({isEnded:true}); }catch(e){} },260); }};
    },
    createInterstitialAd:function(o){
      var id=(o&&o.adUnitId)||''; AdService.mock.calls.push('interstitial:'+id);
      return {adUnitId:id,
        show:function(){ AdService.mock.shows++; return {'catch':function(){}}; },
        load:function(){ return {then:function(f){ if(f)try{f();}catch(e){} return {'catch':function(){}}; },'catch':function(){}}; },
        onLoad:function(f){ setTimeout(function(){ if(f)try{f({}); }catch(e){} },0); },
        onError:function(){},
        onClose:function(f){ setTimeout(function(){ if(f)try{f(); }catch(e){} },260); }};
    }},
  /* 测试钩子：Test 环境可编排「加载失败 / 中途退出 / 超时」，用于自动化测试与降级验证。
     这是 V4.0 §4 要求保留的 Test Mode，不是临时脚手架。 */
  test:{fail:false,cancel:false,timeout:false},
  _seq:0, _pending:null, _rw:null, _it:null, _tapOpts:null, _t0:0,
  /* adUnitSrc：随每条广告埋点上报「挂的是正式位还是测试位」。
     为什么必须有：测试位挂在线上时**游戏照常玩、不报任何错**，只有后台数据里才看得出收益是 0。
     有了这个字段，真机埋点里一眼就能区分「没拉到广告」和「拉的是测试位所以不计费」。 */
  adUnitSrc:'test-unit',
  now:function(){ return nowSec(); },
  /* V6.4.4 tap 来源：开了 mock 通道就用契约 mock，否则用真运行时。
     这一层就是「测试环境能模拟线上环境」的全部机关 —— 下面 _tapRewarded/_tapInterstitial 只认 tapSrc()。 */
  tapSrc:function(){ try{ return AdService.mockSdk?AdService.mock:(window.tap||null); }catch(e){ return null; } },
  hasTap:function(){ try{ var _s=AdService.tapSrc(); return !!(_s&&_s.createRewardedVideoAd); }catch(e){ return false; } },
  /* V6.4.4 修复：srcOf() 统一回答「当前挂的是正式位还是测试位」。
     旧写法拿 CFG.adUnitIsTest 当依据，而那个值在启动时就定死了、切档从不更新 →
     真机切到 TEST 后埋点仍报 formal-unit，验收会被彻底误导。 */
  srcOf:function(){ try{ return (AdService.mockSdk||AdService.env==='online')?'formal-unit':'test-unit'; }catch(e){ return 'test-unit'; } },
  init:function(){
    /* ★ V6.4.4 修复：CFG.mockSdk -> AdService.mockSdk 这一步旧代码漏了，
       导致 ?sdk=mock 与面板「ONLINE 模拟SDK」两处的开关设了却传不到 tapSrc()，
       于是 mock SDK 永远不生效，两格都会掉回 TEST。 */
    AdService.mockSdk=!!CFG.mockSdk;
    AdService.env=CFG.env;
    AdService.degradeReason='';
    AdService.forceRealSdk=!!CFG.forceRealSdk;
    /* V6.4.4 修复：原先这行排在降级判定【之前】，于是「切 ONLINE 却没运行时被踢回 TEST」时
       src 还停在 formal-unit，面板写 TEST、埋点写正式位，自相矛盾 → 移到下面降级之后重算。 */
    /* ★ V6.4.4：这里不再是「没 tap 就一刀切打回 test」—— tap 来源经 tapSrc() 可能是契约 mock，
       于是正式分支在无真机环境下也能完整跑一遍，上线前就能把正式通道的 bug 捞出来。 */
    if(AdService.env==='online'){
      if(!AdService.hasTap()){ AdService.env='test'; AdService.degradeReason='no-tap-runtime'; }
      else if(!(CFG.adUnit&&CFG.adUnit.rewarded)){ AdService.env='test'; AdService.degradeReason='no-ad-unit-id'; }
    }
    if(AdService.forceRealSdk&&AdService.env==='test'&&!AdService.hasTap()){
      AdService.degradeReason='no-real-runtime';      // 要真 SDK、运行时却没 tap → 必须说清楚，不许含糊
    }
    AdService.adUnitSrc=AdService.srcOf();           // 降级之后才算 src，保证面板与埋点说的是同一件事
    AdService._t0=AdService.now();
    AdService.inited=true;
    Track.log('ad_env_init',{env:AdService.env,src:AdService.adUnitSrc,reason:AdService.degradeReason,
      platform:CFG.platform,forceReal:AdService.forceRealSdk,mock:!!AdService.mockSdk,sdk:(AdService.mockSdk?'mock':'real'),
      unit:CFG.adUnitFor('rewarded')});
    return AdService.env;
  },
  /* V6.4.4 三态：test(模拟看完，不碰SDK) / online(真实SDK) / mock(契约mock SDK，走完整正式通道)。
     ★ mock 是给**测试/评审环境**用的：上线前把正式通道整条跑一遍，别等线上才炸。
     切回 test 或真实 online 时顺手把 mock 关掉，防止 mock 通道被留在开着的状态带进线上。 */
  setEnv:function(e){
    if(e==='mock'){ CFG.env='online'; CFG.mockSdk=true; }
    else { CFG.env=(e==='online')?'online':'test'; CFG.mockSdk=false; }
    return AdService.init();
  },
  /* --- 频控（全部可配置；超限=拦截而不是弹出） --- */
  canShowRewarded:function(force){
    if(force)return true;
    return AdService.session.rewarded<CFG.rewardedSessionCap;
  },
  canShowInterstitial:function(){
    var n=AdService.now();
    if(AdService.session.inter>=CFG.interstitialSessionCap){ AdService.stats.capBlocked++; return false; }
    if((n-AdService._t0)<CFG.firstSessionProtection){ AdService.stats.coolBlocked++; return false; }
    if((n-AdService.session.lastInter)<CFG.interstitialCooldown){ AdService.stats.coolBlocked++; return false; }
    if(AdService.session.wins<CFG.interstitialAfterWins)return false;
    return true;
  },
  /* --- 激励视频：看完才发奖；失败/中途退出不发；回调幂等 --- */
  showRewarded:function(scene,opts){
    opts=opts||{};
    AdService.stats.request++;
    Track.log('ad_request',{scene:scene,type:'rewarded',env:AdService.env,src:AdService.adUnitSrc,
      reason:AdService.degradeReason,platform:CFG.platform,sdk:(AdService.mockSdk?'mock':'real')});
    if(!AdService.canShowRewarded(opts.force)){
      AdService.stats.capBlocked++;
      Track.log('ad_cap_blocked',{scene:scene,cap:CFG.rewardedSessionCap});
      /* 只回调 onFail：上限触顶时上层会自己吐一条提示，
         这里再补一条 onNotice 就会变成「两条 toast 互相覆盖」，最后一条还说是"没广告"，是句错话。 */
      if(opts.onFail)try{ opts.onFail('cap'); }catch(e){}
      return false;
    }
    AdService.session.rewarded++;
    AdService.stats.show++;
    var token=++AdService._seq;
    AdService._pending={scene:scene,token:token,rewarded:false};
    Track.log('ad_show',{scene:scene,type:'rewarded',env:AdService.env,src:AdService.adUnitSrc,platform:CFG.platform});
    if(AdService.env==='online')return AdService._onlineRewarded(scene,token,opts);
    return AdService._testRewarded(scene,token,opts);
  },
  _testRewarded:function(scene,token,opts){
    var t=AdService.test;
    /* ★ 强制真 SDK 模式（?sdk=real）：这条路径**绝不模拟发奖**。
       以前 test 分支会假装「广告看完了」直接发奖，于是 ?adunit=formal 在没 tap 的浏览器里看起来也是绿的
       —— 那是假绿。现在把原因原样打出来，让验收能分清「没弹出来」和「弹出来了」。 */
    if(AdService.forceRealSdk){
      AdService.stats.loadFail++;
      Track.log('ad_no_real_sdk',{scene:scene,type:'rewarded',reason:AdService.degradeReason||'no-tap-runtime'});
      AdService._fail(scene,opts);
      return true;
    }
    if(t.fail||t.timeout){
      AdService.stats.loadFail++;
      Track.log('ad_load_fail',{scene:scene,type:'rewarded',env:'test',err:(t.timeout?'timeout':'mock')});
      AdService._fail(scene,opts);
      return true;
    }
    if(t.cancel){
      AdService.stats.cancel++;
      Track.log('ad_cancel',{scene:scene,type:'rewarded',env:'test'});
      if(opts.onCancel)try{ opts.onCancel('cancel'); }catch(e){}
      return true;
    }
    AdService._grant(scene,token,opts,'test');
    return true;
  },
  _onlineRewarded:function(scene,token,opts){
    var ad=AdService._tapRewarded();
    AdService._tapOpts={scene:scene,token:token,opts:opts};
    if(!ad){ AdService.stats.loadFail++; Track.log('ad_load_fail',{scene:scene,err:'sdk-missing'}); AdService._fail(scene,opts); return true; }
    try{
      var p=ad.show();
      if(p&&p['catch']){
        p['catch'](function(){
          try{
            var lp=ad.load();
            if(lp&&lp.then){
              lp.then(function(){ try{ ad.show(); }catch(e2){ AdService._fail(scene,opts); } })
                ['catch'](function(){ AdService._fail(scene,opts); });
            }else{ AdService._fail(scene,opts); }
          }catch(e3){ AdService._fail(scene,opts); }
        });
      }
    }catch(e){ AdService._fail(scene,opts); }
    return true;
  },
  _tapRewarded:function(){
    if(AdService._rw)return AdService._rw;
    var _sr=AdService.tapSrc();
    if(!_sr)return null;
    try{
      AdService._rw=_sr.createRewardedVideoAd({adUnitId:CFG.adUnitFor('rewarded')});
      AdService._rw.onLoad(function(){
        Track.log('ad_load_success',{type:'rewarded',env:'online',src:AdService.adUnitSrc,
          platform:CFG.platform,sdk:(AdService.mockSdk?'mock':'real'),unit:CFG.adUnitFor('rewarded')});
      });
      AdService._rw.onError(function(err){
        var msg='';
        try{ msg=String((err&&(err.errMsg||err.message))||err); }catch(e){ msg='unknown'; }
        Track.log('ad_load_fail',{type:'rewarded',env:'online',err:msg,src:AdService.adUnitSrc,
          platform:CFG.platform,unit:CFG.adUnitFor('rewarded')});
        AdService.stats.loadFail++;
        /* V6.4.17:拉取失败也把请求收尾,以前只记日志→按钮没反应 */
        var pend=AdService._tapOpts;
        if(pend&&!(AdService._pending&&AdService._pending.rewarded&&AdService._pending.token===pend.token)){
          AdService._tapOpts=null;AdService._fail(pend.scene,pend.opts);
        }
      });
      AdService._rw.onClose(function(res){
        var pend=AdService._tapOpts;
        if(!pend)return;
        var ended=!!(res&&res.isEnded);
        if(ended){
          AdService._grant(pend.scene,pend.token,pend.opts,'online');
        }else{
          AdService.stats.cancel++;
          Track.log('ad_cancel',{scene:pend.scene,type:'rewarded',env:'online'});
          if(pend.opts&&pend.opts.onCancel)try{ pend.opts.onCancel('cancel'); }catch(e){}
        }
      });
    }catch(e){ return null; }
    return AdService._rw;
  },
  /* --- 插屏（低频、可关闭、有冷却与会话上限） --- */
  showInterstitial:function(scene,opts){
    opts=opts||{};
    if(!AdService.canShowInterstitial()){
      Track.log('ad_interstitial_blocked',{scene:scene});
      if(opts.onSkip)try{ opts.onSkip('blocked'); }catch(e){}
      return false;
    }
    AdService.session.inter++;
    AdService.session.lastInter=AdService.now();
    AdService.stats.show++;
    Track.log('ad_show',{scene:scene,type:'interstitial',env:AdService.env});
    if(opts.onDone)try{ opts.onDone(); }catch(e){}
    if(AdService.env!=='online')return true;             // TEST：直接放行（不产生真实收入）
    var it=AdService._tapInterstitial();
    if(!it){ Track.log('ad_load_fail',{scene:scene,type:'interstitial',err:'sdk-missing'}); return true; }
    try{
      var p=it.show();
      if(p&&p['catch'])p['catch'](function(){ Track.log('ad_load_fail',{scene:scene,type:'interstitial',err:'show-rejected'}); });
    }catch(e){ Track.log('ad_load_fail',{scene:scene,type:'interstitial',err:'throw'}); }
    return true;
  },
  _tapInterstitial:function(){
    if(AdService._it)return AdService._it;
    var _sr2=AdService.tapSrc();
    if(!(_sr2&&_sr2.createInterstitialAd))return null;
    try{
      AdService._it=_sr2.createInterstitialAd({adUnitId:CFG.adUnitFor('interstitial')});
      AdService._it.onLoad(function(){
        Track.log('ad_load_success',{type:'interstitial',env:'online',src:AdService.adUnitSrc,
          platform:CFG.platform,sdk:(AdService.mockSdk?'mock':'real'),unit:CFG.adUnitFor('interstitial')});
      });
      AdService._it.onError(function(err){
        var msg='';
        try{ msg=String((err&&(err.errMsg||err.message))||err); }catch(e){ msg='unknown'; }
        Track.log('ad_load_fail',{type:'interstitial',env:'online',err:msg,src:AdService.adUnitSrc,
          platform:CFG.platform,unit:CFG.adUnitFor('interstitial')});
      });
      AdService._it.onClose(function(){ Track.log('ad_interstitial_close',{env:'online'}); });
    }catch(e){ return null; }
    return AdService._it;
  },
  /* --- 发奖（幂等：同一 token 只发一次，重复回调被拦截并埋点） --- */
  _grant:function(scene,token,opts,src){
    var pd=AdService._pending;
    if(pd&&pd.token===token&&pd.rewarded){
      AdService.stats.dupBlocked++;
      Track.log('reward_duplicate_blocked',{scene:scene,src:src||AdService.env});
      return false;
    }
    if(pd&&pd.token===token)pd.rewarded=true;
    AdService.stats.complete++;
    Track.log('ad_complete',{scene:scene,src:src||AdService.env,platform:CFG.platform});
    AdService.stats.rewarded++;
    Track.log('reward_granted',{scene:scene,src:src||AdService.env,platform:CFG.platform});
    if(opts&&opts.onReward)try{ opts.onReward(); }catch(e){}
    return true;
  },
  /* --- 广告拉取失败：不卡流程（V4.0 §27-P1「广告失败后的友好 fallback」） --- */
  _fail:function(scene,opts){
    AdService.stats.loadFail++;
    if(opts&&opts.onFail)try{ opts.onFail('load'); }catch(e){}
    if(opts&&opts.onFallback&&CFG.adFailFallback==='free'){
      AdService.stats.fallback++;
      Track.log('ad_fallback_granted',{scene:scene,mode:'free'});
      try{ opts.onFallback(); }catch(e){}
    }else if(opts&&opts.onNotice){
      try{ opts.onNotice('load'); }catch(e){}
    }
  },
  /* 复位会话级频控（新的一次会话/新的一局需要时调用） */
  resetSession:function(){
    AdService.session={rewarded:0,inter:0,lastInter:-99999,wins:0};
    AdService._t0=AdService.now();
  }
};

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* ================= 关卡规划 V6.0：分阶段难度路线 =================

   [为什么要重做] V4.0 的曲线在 9 关以后把格数封顶 26、颜色封顶 6、水管封顶 7，
   结果第 24 关起**所有参数完全触顶**：面板写着 90 关，25~90 关只是同一套参数的
   不同布局（实测 L45/L60/L75/L90/L91 逐字相同）。难度上限被自己钉死了。

   [表里给的是区间，不是硬编码] 每个阶段按「关内进度 k∈[0,1]」在区间里插值取整：
     阶段      关卡     水管      颜色      底部空间
     教学      1-3     4-5       3-4      小(3×3)
     入门正式   4-8     6-8       4-6      ~5×4
     正式挑战   9-15    8-12      6-9      ~7×5
     高密度    16-25   12-15     9-12      ~8×6
     困难      26-40   15-17     12-14     ~9×6
     极限      41-60   17-19     14-15     ~9×6
     极限+     61-90   19-20     15-16     ~9×6
   ⚠ 相邻阶段的区间端点刻意接上（入门从 6 管起 = 教学校顶的 5+1），
     所以整条曲线逐关只涨不回落 —— 这条由测试断言守着。

   [三道校准，顺序固定，任何一条不过就回退，绝不硬塞]
     ① 货架放得下：tile ≥ 46（≈25pt 触控下限，见 layoutAll）→ 行数硬上限 6
     ② 台面槽够用：有效空槽 − 颜色数 ∈ [−1, +1]（受控实验给出的「难度开关」）
     ③ 单局操作量：预估玩家操作数 ≤ MOVE_BUDGET → 超了先削行、再削列

   [为什么不是 V6.0 表里的 9×8] 9 列 × 8 行 = 72 瓶，再加门洞多塞 ≈ 82 瓶 →
   预估 190 次操作（≈6.3 分钟）、tile 掉到 42（≈19pt，低于触控下限）。
   V6.0 自己写了「不允许机械硬编码 / 必须以实际可玩性、可解性和决策密度校准」，
   所以这里把压迫感做在**颜色与水管密度**（真正增加同时可选项与前瞻长度）上，
   而不是继续堆操作量 —— 加格子加的是操作量，不是思考深度，这是本项目踩过的老坑。

   [波浪] 每 5 关一个周期、周期末为峰值关。只对第 9 关以后生效（教学/入门刻意平缓）：
   峰值 +1 门洞；放水 −1 门洞（冰冻 >1 时再 −1）。峰谷差距很小，保证「逐关只涨不跌」。

   [tier 两套轴，互不干扰]

  };
  gateCellStart.sort(function(a,b){return degOf(a)-degOf(b);});   // 越「通气」的格子越往后放
  var chosen=[];
  (function(){
    var need=gateN;
    var dfs=function(start){
      if(chosen.length>=need)return true;
      for(var i=start;i<gateCellStart.length;i++){
        var cand=gateCellStart[i];
        if(chosen.indexOf(cand)>=0)continue;
        var ok=true;
        for(var j=0;j<chosen.length;j++)if(cellsAdjacent(cand,chosen[j])){ok=false;break;}
        if(!ok)continue;
        chosen.push(cand);
        if(dfs(i+1))return true;
        chosen.pop();
      }
      return false;
    };
    dfs(0);
  })();
  gateN=chosen.length;
  if(gateN<gateSlots.length){                       // 位置不够就少放几个洞
    gateSlots=gateSlots.slice(0,gateN);
    extraSum=0;
    for(var gz=0;gz<gateSlots.length;gz++)extraSum+=gateSlots[gz]-1;
    /* 格子数不变（由关卡布局表定），所以要把多出来的瓶子删掉 —— 从「瓶数最多的颜色」里删，
       既保证每色瓶数依然尽量均匀，也保证「瓶子总数 == 格子数 + 门洞多塞数」。 */
    var want=cellsTarget+extraSum;
    while(bottles.length>want){
      var cnt2={},mxCol=-1,mxN=0;
      for(var bi2=0;bi2<bottles.length;bi2++){var cc2=bottles[bi2].col;cnt2[cc2]=(cnt2[cc2]||0)+1;}
      for(var kc2 in cnt2)if(cnt2[kc2]>mxN){mxN=cnt2[kc2];mxCol=+kc2;}
      for(var bi3=bottles.length-1;bi3>=0;bi3--)if(bottles[bi3].col===mxCol){bottles.splice(bi3,1);break;}
    }
    n0=bottles.length;
  }
  var bx=shuffle(bottles.slice()), bi=0;
  for(var g2=0;g2<gateN;g2++){
    var gc=chosen[g2];
    G.gates.push({cell:gc,dir:0,n:gateSlots[g2]});      // 朝向等瓶子落位后再定（见下）
    for(var qi=0;qi<gateSlots[g2];qi++){
      var gb=bx[bi++]; gb.cell=gc; gb.gate=g2; gb.q=qi;
    }
    gateTaken.push(gc);
  }
  /* 剩下的瓶子把其余格子全部填满（不重排、不留空） */
  var restCells=[];
  for(var rc0=0;rc0<cellsNeed;rc0++)if(gateTaken.indexOf(rc0)<0)restCells.push(rc0);
  shuffle(restCells);
  for(var ri=0;ri<restCells.length&&bi<n0;ri++){
    var rb=bx[bi++]; rb.cell=restCells[ri]; rb.gate=-1; rb.q=0;
  }
  G.bottles=bottles;
  /* ---- 门洞朝向 + 冰冻瓶：这两件事必须「一起定」，定完还要过一遍可解性自检。
     单独看，门洞朝向只要「界内」就没问题；但它和冰冻瓶凑一起会形成环（见 layoutSolvable 注释）：
     三个洞全朝着中间那格 → 洞要等中间空出来才通，中间那格又恰是冰冻瓶、解冻要等四邻空出 2 格，
     于是两边互等，谁也动不了。规则：
       ① 洞口不朝「另一个门洞格」（两个洞互指 = 互锁）
       ② 洞口不朝「冰冻瓶」（互相牵制 = 环）
       ③ 尽量不朝「已经被别的洞指过的格子」 —— 箭头分散开，不会再出现「全指向中间」
       ④ 兜底允许朝空格（洞直接就是通的，比朝一个被挡的瓶子更好）
       ⑤ 定完跑 layoutSolvable()，剥不干净就重掷；40 次仍不行就放弃冰冻瓶（冰冻最容易成环） */
  var dirOk=function(gcell,d1){
    var nc=neighborCell(gcell,d1);
    return nc>=0&&gateAt(nc)<0&&!iceAt(nc);
  };
  var pickGateDirs=function(){
    var used={};
    for(var gd=0;gd<G.gates.length;gd++){
      var gcell=G.gates[gd].cell,inD=[],occD=[],freeD=[];
      for(var d1=0;d1<4;d1++)if(neighborCell(gcell,d1)>=0)inD.push(d1);
      for(var d2=0;d2<inD.length;d2++){
        if(!dirOk(gcell,inD[d2]))continue;
        if(cellOccupied(neighborCell(gcell,inD[d2])))occD.push(inD[d2]); else freeD.push(inD[d2]);
      }
      var fresh=[];
      for(var d3=0;d3<occD.length;d3++)if(!used[neighborCell(gcell,occD[d3])])fresh.push(occD[d3]);
      var pick=fresh.length?fresh:(occD.length?occD:(freeD.length?freeD:inD));
      var dir=pick[(Math.random()*pick.length)|0];
      G.gates[gd].dir=dir;
      used[neighborCell(gcell,dir)]=1;
    }
  };
  /* 冰冻瓶候选：不选角落（角落天生两侧朝界外）、不选开局就已两格空的格子（冻了等于没冻）、
     洞里的瓶子不冻（免得两套规则打架）。 */
  var iceWant=plan.ice;
  var icePool=[];
  for(var ci=0;ci<bottles.length;ci++){
    var cb=bottles[ci];
    if(cb.gate>=0||cellIsCorner(cb.cell))continue;
    var emp=0;
    for(var cd=0;cd<4;cd++)if(neighborEmpty(cb.cell,cd))emp++;
    if(emp>=2)continue;
    icePool.push(cb);
  }
  var solvableOK=false;
  for(var attempt=0;attempt<40&&!solvableOK;attempt++){
    shuffle(icePool);
    for(var z0=0;z0<bottles.length;z0++)bottles[z0].locked=0;
    var iceN=Math.min(iceWant,icePool.length);
    for(var lk=0;lk<iceN;lk++)icePool[lk].locked=1;
    pickGateDirs();
    solvableOK=layoutSolvable();
  }
  if(!solvableOK){                                 // 兜底：冰冻瓶最容易和门洞成环 → 全撤掉，只留门洞
    for(var z1=0;z1<bottles.length;z1++)bottles[z1].locked=0;
    pickGateDirs();
  }
  // 液体池：总量与瓶容量严格一致
  var pool=[];
  for(var b=0;b<bottles.length;b++)for(var u=0;u<bottles[b].cap;u++)pool.push(bottles[b].col);
  shuffle(pool);
  var nt=tubeCountFor(pool.length,plan.tubes);    // 管数由关卡决定，只做上下界剪裁
  var base=Math.floor(pool.length/nt), sizes=[];
  for(var z=0;z<nt;z++)sizes.push(base);
  for(var r=0;r<pool.length%nt;r++)sizes[r]++;
  /* 水层高自适应：高关卡瓶子多、总水量大，若固定每层高度，水管会顶出屏幕。
     顶部留 118px 安全区（HUD 在 28~88，必须完全避开，否则高关卡管子会撞到「关卡 N」）。
     按「水最多的那根管」反算每层高度：最高 36（UH 上限），最低 14。 */
  var maxLayers=sizes.length?Math.max.apply(null,sizes):1;
  /* 层高下限从 14 提到 28：原来为了「管子不出屏」会把每层压到 14~19px，
     结果水柱永远顶在 y≈108，玩家看到的是「被压扁的水」，完全没有压迫感。
     现在低于 28 就不再压了 —— 多出来的水柱直接顶出屏幕顶部（drawTube 平口 + 顶部渐隐）。 */
  /* 层高下限随大档抬高（28 → 34）：越到后期越不肯把水柱压扁，
     于是水柱从「刚好顶到画面上沿」一路长到「真的冲出屏幕顶部」——压迫感是跟着关卡走的。 */
  var uhMin=28+Math.min(6,plan.era);
  var uh=Math.min(UH,Math.floor((BOTT_Y-118)/maxLayers));
  if(uh<uhMin)uh=uhMin;
  G.uh=uh;
  /* 切管：重洗到「没有整根同色的管」为止 —— 整根同色 = 一口气接完，是白送的假难度。
     某色总水量 > 单管层数时（实测只有「4 关极限档：色4/管6/瓶10，色0 有 9 滴 vs 单管 5 层」），
     随机切片会以约 2.5%/局的概率把 5 滴同色切进同一根管 —— 概率很低但每次开局都可能撞上，
     所以这里用「重洗重切」而不是运气质检：洗牌一旦退化成不洗，40 次全败 → 关卡明显变简单，
     而 qa_design.js 的「不存在纯色管」断言会当场把它抓出来。 */
  var tubes=[],pureN=1;
  for(var guard=0;guard<40&&pureN;guard++){
    shuffle(pool);
    tubes=[]; pureN=0;
    var p=0;
    for(var t=0;t<nt;t++){
      var units=pool.slice(p,p+sizes[t]); p+=sizes[t];
      tubes.push({units:units,h:sizes[t]*uh+20,x:0,drop:0}); // 玻璃管刚好装满初始水量（贴合无空腔）
      if(units.length>1){
        var same=true;
        for(var k=1;k<units.length;k++)if(units[k]!==units[0]){same=false;break;}
        if(same)pureN++;
      }
    }
  }
  G.tubes=tubes;
  G.slots=[];
  for(var s2=0;s2<slotsN;s2++)G.slots.push({open:s2<slotsN-1}); // 只留最右一个广告解锁槽
  layoutAll();
  G.state='play';
  /* 单局步数基准（星级用）：par = 宽裕估计的「好成绩步数」 */
  G.par=Math.max(10,Math.round(G.bottles.length*1.4+gateN*2));
  /* 埋点：关卡开始（带档位与难度快照，用来回答「改难度后有没有改善」） */
  Track.log('level_start',{tier:G.tier,warm:G.warm||0,stage:plan.stage,colors:plan.colors,cells:plan.cells,
    gates:plan.gates,ice:plan.ice,slots:plan.slots,tubes:plan.tubes,density:plan.density,
    est:plan.estActions,daily:G.daily?'1':'0',theme:plan.theme?'1':'0',par:G.par});
  /* ---- V6.0 §五-A：最高关卡只增不减 ----
     maxLevel 记的是「玩家到达过的最高关」，与「已解锁的下一关 level」分开存。
     回归热身、重开本关、失败重来都不会让它变小 —— 这是测试第 8 条（不丢进度）的落点。 */
  try{
    if(!G.daily&&lv>(Store.get('maxLevel',1)||1))Store.set('maxLevel',lv);
    Store.set('lastPlayed',nowMs());
  }catch(e){}
  if(G.daily)Track.log('challenge_start',{date:G.dailyDate,seed:(opts.seed|0)});
  /* 新手引导：前 3 关各一条轻量气泡提示，看过就不再打扰（进度存在存档里） */
  var tutSeen=Store.get('tut',0);
  if(lv<=3&&tutSeen<lv){ G.tutTip=lv; Store.set('tut',Math.max(tutSeen,lv)); }
  else G.tutTip=0;
  if(gateN>0&&!opts.quiet)toast('新玩法：门洞里的瓶子要按顺序取');
  return true;
  }finally{
    if(_rndSave)Math.random=_rndSave;               // 必须还原，否则污染后续所有随机行为
  }
}
function layoutAll(){
  /* ---- 水管：宽度/间距不再写死，按「有几根管」反算 ----
     旧代码把 7 根当物理上限（7×(72+32) 正好铺满 720），于是 V6.0 要的 12~18 根管
     在布局层就没法实现 —— 这也是上一版曲线第 24 关就触顶的根因之一。
     现在改成：先按根数给一个舒适的间距档位，算出管宽；管宽掉到触控下限以下时，
     才把间距压缩到 TUBE_GAP_MIN。TUBE_MIN_W / TUBE_GAP_MIN 与 tubeCountFor 共用，
     所以「计划几根管」和「实际画得下几根」永远是同一套常量推出来的。 */
  var nT=G.tubes.length;
  var gap=nT<=3?46:(nT<=4?32:(nT<=6?20:(nT<=10?12:TUBE_GAP_MIN)));
  var tw=Math.min(nT<=3?92:(nT===4?80:72),Math.floor((VW-24-(nT-1)*gap)/nT));
  if(tw<TUBE_MIN_W){
    tw=TUBE_MIN_W;
    gap=nT>1?Math.max(TUBE_GAP_MIN,Math.floor((VW-24-nT*TUBE_MIN_W)/(nT-1))):gap;
  }
  G.tubeW=tw; G.tubeGap=gap;
  var totalW=nT*tw+(nT-1)*gap;
  var x0=(VW-totalW)/2;
  for(var i=0;i<nT;i++){
    G.tubes[i].x=x0+i*(tw+gap);
  }
  G.junctionY=BOTT_Y+46;
  /* ---- 台面槽位：间距随槽数收紧（高关卡槽位要跟颜色数对齐，17 槽时必须自己算间距）---- */
  var nS=G.slots.length;
  var step=nS<=4?140:(nS===5?124:(nS===6?112:Math.min(100,Math.floor((VW-56)/Math.max(1,nS-1)))));
  var sx0=(VW-(nS-1)*step)/2;
  G.slotX=[]; G.slotStep=step;
  for(var s=0;s<nS;s++)G.slotX.push(sx0+s*step);
  /* 台面瓶子尺寸必须跟着槽间距缩，否则 17 个槽会挤成一团（旧代码写死 jw=76） */
  G.jw=Math.max(26,Math.min(76,Math.floor(step*0.78)));
  G.jh=G.jw*1.13;
  G.trayRx=Math.min(50,step*0.5);
  // 底部货架：行数固定 3 行，列数在 genLevel 里按瓶子数算好（rowLen）。
  // 注意：格子归属与行长度只在 genLevel 里定一次，这里绝不重排 —— 否则撤销会把格子位置打乱
  var rows=G.gridRows||GRID_ROWS, maxRow=G.gridCols||3;
  /* V6.1：左右边距从 40 压到 28（各 14px），配合 11 列 / GX=8 让货架横向铺满；
     格子上限从 112 放宽到 190，让格子尽量撑满可用空间 */
  var tileW=Math.floor((VW-28-(maxRow-1)*GX)/maxRow);
  var availH=(TOOL_Y-12)-GRID_Y0;
  var tileH=Math.floor((availH-(rows-1)*GY)/rows);
  var tile=Math.max(46,Math.min(190,tileW,tileH));
  G.tile=tile;
  var gridH=rows*tile+(rows-1)*GY;
  G.gridY0=GRID_Y0+Math.max(0,Math.round((availH-gridH)/2));   // 货架在可用区域里垂直居中
  /* 瓶子随格子放大：原来写死 Math.min(58,…)，格子 106 时瓶子只有 58 宽（仅占 55%），显得又小又空。
     改成按格子的 66% 取，上限 96（格子够大时也不至于胖到挤在一起）。
     6 行（格子 56）时比例抬到 0.74，瓶子不至于缩成一颗豆。 */
  G.bw=Math.min(tile*(tile<92?0.74:0.66),96); G.bh=G.bw*1.10;   // 格子小(5行)时把比例调高，瓶子不至于缩太小
  placeBottles();
}
/* 货架按「行长度表」排布：行数固定 3，每行格数可不同（最后一行短一点），行内居中。
   这样「格子数 == 实际被瓶子占用的格数」，开局不可能出现空格子。 */
function buildGrid(cellsNeed,rows){
  rows=Math.max(2,Math.min(rows,Math.max(1,Math.floor(cellsNeed/2))));
  var base=Math.floor(cellsNeed/rows),rem=cellsNeed%rows;
  var rl=[];
  for(var r=0;r<rows;r++)rl.push(base+(r<rem?1:0));
  G.rowLen=rl; G.gridRows=rows;
  G.rowBase=[]; var acc=0;
  for(var r2=0;r2<rows;r2++){G.rowBase.push(acc);acc+=rl[r2];}
  G.cellR=[];G.cellC=[];
  for(var r3=0;r3<rows;r3++)for(var c3=0;c3<rl[r3];c3++){var id=G.rowBase[r3]+c3;G.cellR[id]=r3;G.cellC[id]=c3;}
  G.gridCols=Math.max.apply(null,rl);
  G.cellCount=acc;
}
/* (行,列) → 格子号；越界返回 -1（界外一律算空） */
function cellAt(r,c){
  if(r<0||r>=G.gridRows||c<0||c>=G.rowLen[r])return -1;
  return G.rowBase[r]+c;
}
function rowX0(r){var n=G.rowLen[r];return (VW-(n*G.tile+(n-1)*GX))/2;}
/* 上下左右四向的邻格；超出货架返回 -1，界外一律算空 */
function neighborCell(cell,d){
  if(cell<0||cell>=G.cellCount)return -1;
  return cellAt(G.cellR[cell]+DIRS[d].dy,G.cellC[cell]+DIRS[d].dx);
}
/* 4 邻格（上下左右）—— 门洞朝向、冰冻瓶解冻、门洞不相邻都靠它 */
function cellsAdjacent(a,b){
  for(var d=0;d<4;d++)if(neighborCell(a,d)===b)return true;
  return false;
}
function cellIsCorner(cell){
  var n=0;
  for(var d=0;d<4;d++)if(neighborCell(cell,d)<0)n++;
  return n>=2;
}
function cellRect(cell){
  var r=G.cellR[cell],c=G.cellC[cell];
  return {x:rowX0(r)+c*(G.tile+GX),y:G.gridY0+r*(G.tile+GY),w:G.tile,h:G.tile};
}
function slotPos(s){return {x:G.slotX[s],y:SLOT_Y};}
function placeBottles(){
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.place==='grid'){var rc=cellRect(b.cell);b.x=rc.x+rc.w/2;b.y=rc.y+rc.h/2+18;}
    else if(b.place==='counter'){var sp=slotPos(b.slot);b.x=sp.x;b.y=sp.y;}
  }
}

/* ================= 快照 / 撤销 =================
   captureState / applySnapshotObj 是这一块的**唯一一份**「局面 ⇄ 数据」互换：
   snapshot(入栈)、doUndo(出栈)、restoreHistoryAt(复活回滚)、failUndoCommit(试算)
   全部走它。以前三处各写一遍字段拷贝，改字段时漏一处就是「撤销后瓶子状态错位」。 */
function captureState(){
  return {tubes:G.tubes.map(function(t){return t.units.slice();}),
    bottles:G.bottles.map(function(b){return {col:b.col,cap:b.cap,fill:b.fill,locked:b.locked,place:b.place,slot:b.slot,cell:b.cell,gate:b.gate,q:b.q};}),
    slots:G.slots.map(function(x){return {open:x.open};}),clears:G.clears,unlockLeft:G.unlockLeft,
    adUnlockLeft:G.adUnlockLeft,
    /* 步数必须进快照：撤销要把 G.moves 也退回去，否则「放错 → 撤销」这种纯试错
       会被永久记在步数账上，星级只惩罚一次失误却记了两步（见 applySnapshotObj）。 */
    moves:G.moves};
}
function applySnapshotObj(s){
  for(var i=0;i<G.tubes.length;i++)G.tubes[i].units=s.tubes[i].slice();
  for(var b=0;b<G.bottles.length;b++){
    var d=s.bottles[b],bb=G.bottles[b];
    bb.fill=d.fill;bb.locked=d.locked;bb.place=d.place;bb.slot=d.slot;bb.cell=d.cell;
    bb.gate=(d.gate===undefined?-1:d.gate);bb.q=(d.q||0);bb.shake=0;
    bb.capT=bb.place==='counter'?1:0;bb.done=false;bb.doneT=0;
  }
  /* V6.4.6：广告解锁会新增槽位 → 快照里的槽数可能比当前少。旧代码按当前 G.slots.length 遍历，
     槽数变少时 s.slots[sl] 是 undefined → 「广告解锁 → 撤销」当场崩溃。槽数不同就整体换掉。 */
  if(s.slots&&s.slots.length!==G.slots.length){ G.slots=s.slots.map(function(x){return {open:x.open};}); }
  else for(var sl=0;sl<G.slots.length;sl++)G.slots[sl].open=s.slots[sl].open;
  G.clears=s.clears;
  /* 解锁次数必须跟着快照一起回滚：否则「解锁 → 撤销」会变成 unlockLeft 已扣、槽位又锁回去，
     这一关的免费解锁就永久消失了（玩家再也打不开那个槽）。 */
  if(s.unlockLeft!==undefined)G.unlockLeft=s.unlockLeft;
  if(s.adUnlockLeft!==undefined)G.adUnlockLeft=s.adUnlockLeft;
  /* 步数跟着快照回滚：撤销 = 这一步没发生过，不是"又多走了一步"。
     注意 startReturn 里仍然是 G.moves++（退回一瓶也是一步操作）——
     否则 place(+1) 与 return(−1) 相消后 moves 恒等于瓶子数，星级指标当场失去意义。 */
  if(s.moves!==undefined)G.moves=s.moves;
  layoutAll();   // V6.4.6：槽数变了 → placeBottles() 按 b.slot 重排台面瓶
}
function snapshot(){
  G.history.push(JSON.stringify(captureState()));
  if(G.history.length>30)G.history.shift();
}
function doUndo(){
  if(G.anim||G.state!=='play')return;
  if(!G.history.length||G.undoLeft<=0){toast('没有撤销次数了');SFX.no();return;}
  applySnapshotObj(JSON.parse(G.history.pop()));
  G.undoLeft--; persistTools();
  SFX.undo();
}
function toast(msg){G.toast={msg:msg,t:0};}
/* 醒目横幅：比 toast 更大、停在台面上方、带抖动 —— 专门用于「点了但不行」这种
   必须让玩家立刻看见的反馈（小 toast 在 HUD 下方，玩家常看不见 → 会以为「点不动」） */
function warn(msg){G.warn={msg:msg,t:0};}

/* ================= 动作 ================= */
function freeSlot(){
  var used={};
  for(var b=0;b<G.bottles.length;b++)if(G.bottles[b].place==='counter')used[G.bottles[b].slot]=1;
  for(var s=0;s<G.slots.length;s++)if(G.slots[s].open&&!used[s])return s;
  return -1;
}
function bottomOf(t){return t.units.length?t.units[0]:-1;}
function tryDrinks(){
  if(G.anim||G.state!=='play')return;
  for(var i=0;i<G.bottles.length;i++){
    var b0=G.bottles[i];
    if(b0.place==='counter'&&!b0.done&&b0.fill>=b0.cap){completeJar(b0);return;}
  }
  /* 接水的优先顺序：台面上「已经接了水」的同色瓶先续接，再轮到空瓶。
     否则台面上有半瓶红色的情况下新放一个红瓶，水会接到新瓶上，老的永远接不满。 */
  for(var pass=0;pass<2;pass++){
    for(var i2=0;i2<G.bottles.length;i2++){
      var b=G.bottles[i2];
      if(b.place!=='counter'||b.fill>=b.cap)continue;
      if(pass===0&&b.fill<=0)continue;      // 第一轮：只找已经有水的
      if(pass===1&&b.fill>0)continue;       // 第二轮：再考虑空瓶
      for(var t=0;t<G.tubes.length;t++){
        if(bottomOf(G.tubes[t])===b.col){
          G.anim={type:'drink',b:b,tube:t,t:0,dur:0.55};
          G.lastPour=b;   // 水管终点同步到真正在接水的瓶（修：多瓶在台面时水管指向数组第一个瓶的错位）
          SFX.pour();
          return;
        }
      }
    }
  }
}
function startPlace(b){
  if(G.anim)return; // 防止覆盖消除动画导致瓶子卡死占位
  if(G.mode==='return')G.mode=null;
  var s=freeSlot();
  if(s<0){b.shake=0.5;warn('台面满了！点「撤销」把一个瓶子放回格子');SFX.no();return;}
  snapshot();
  G.moves++;
  b.place='anim'; b.slot=s;
  G.anim={type:'place',b:b,t:0,dur:0.5,fx:b.x,fy:b.y,tx:G.slotX[s],ty:SLOT_Y};
  SFX.place();
}
/* 把正在飞的瓶子立刻「落定」。
   用途：玩家在「放置/退回」动画期间又点了一下 —— 以前那次点击会被直接吞掉，
   连点就会觉得「点不动」。现在先落定，再处理这一次点击，输入永不丢失。 */
function snapAnim(){
  var a=G.anim; if(!a)return;
  if(a.type==='place'||a.type==='return'){
    a.b.place=(a.type==='place')?'counter':'grid';
    a.b.x=a.tx; a.b.y=a.ty;
    if(a.type==='place')a.b.capT=0.001;
    G.anim=null;
  }
}
function startReturn(b){
  if(G.anim)return;
  snapshot();
  G.moves++;
  b.place='anim';
  var rc=cellRect(b.cell);
  G.anim={type:'return',b:b,t:0,dur:0.42,fx:b.x,fy:b.y,tx:rc.x+rc.w/2,ty:rc.y+rc.h/2+18};
  SFX.tap();
}
function finishDrink(){
  var a=G.anim,b=a.b,tube=G.tubes[a.tube];
  tube.units.splice(0,1); tube.drop=1;
  b.fill++;
  SFX.gulp();
  var sp=slotPos(b.slot);
  for(var p=0;p<8;p++)particles.push({x:sp.x,y:sp.y-70,vx:(Math.random()-0.5)*120,vy:-Math.random()*120,g:300,life:0.5,age:0,col:light(COLORS[b.col],0.4),r:2+Math.random()*3});
  G.anim=null;
  if(b.fill>=b.cap)completeJar(b);
}
function completeJar(b){
  snapshot();
  var flyFill=b.fill, flyCol=b.col, flyX=b.x, flyY=b.y;
  // 立刻释放槽位/动画槽：消除只是纯视觉的飞出特效，不再占用状态机
  b.place='gone'; b.done=false; b.fill=0; b.capT=0; b.slot=-1; b.doneT=0;
  G.clears++;
  flying.push({col:flyCol,fill:flyFill,cap:b.cap,x:flyX,y:flyY,t:0});
  for(var p=0;p<30;p++)particles.push({x:flyX,y:flyY-60,vx:(Math.random()-0.5)*380,vy:-Math.random()*420-60,g:600,life:1+Math.random()*0.6,age:0,col:COLORS[(Math.random()*COLORS.length)|0],r:3+Math.random()*4});
  SFX.done();
  checkAllGone();
}
/* ★ V6.4.6 重写：旧版只有「每关 1 次免费解锁」，用完就 return —— 于是右上角那个
   「看广告解锁」徽章**一次广告都产生不了**，名字写着看广告、实际是死的。
   现在两条路：① 每关送的 1 次免费，直接开；② 免费用完 → 真的走 adReward 看广告开槽。 */
function persistTools(){
  try{
    if(!Store.data)return;
    Store.data.tools={clear:G.tools.clear|0,finger:G.tools.finger|0,swap:G.tools.swap|0};
    Store.data.undo=G.undoLeft|0;
    Store.data.unlockLeft=G.unlockLeft|0;
    Store.save();
  }catch(e){}
}
function unlockSlot(){
  if(G.anim)return;
  var target=-1;
  for(var s=0;s<G.slots.length;s++)if(!G.slots[s].open){target=s;break;}
  if(target<0){toast('台面都开完了'); SFX.no(); return;}
  if(G.unlockLeft>0){
    snapshot(); G.slots[target].open=true; G.unlockLeft--; G.moves++;
    toast('新台面解锁！'); SFX.cap(); persistTools(); ensureAdSlot(); return;
  }
  if((G.adUnlockLeft||0)<=0){ toast('本关的解锁次数都用完啦'); SFX.no(); return; }
  unlockByAd(target);
}
/* 看广告解锁：走完整 adReward（看完才发奖，中途退出不发）。 */
function unlockByAd(target){
  var opened=function(){
    G.slots[target].open=true; G.adUnlockLeft--; G.moves++;
    ensureAdSlot();
  };
  adReward('unlock_slot',
    function(){ snapshot(); opened(); toast('看广告解锁！台面多了一个位置'); SFX.cap(); },
    function(){ /* V6.4.7 线上广告拉取失败：绝不静默送槽。
       旧版这里直接 opened() 白送一格 → 玩家点一下解锁一下、广告从不弹出，却以为已经看过了广告。
       商业原则：没看成广告就不给奖励，失败只提示。 */
      Track.log('ad_unlock_denied',{scene:'unlock_slot',reason:'ad_fail'});
      toast('广告没加载出来，这次没解锁'); SFX.no(); });
}
/* V6.4.7：已**不再**补新锁槽（补槽会导致每解一次就多一个可点徽章 → 看起来能无限解锁）。
   徽章在广告额度用完、或广告始终拉不到时自然消失。函数保留是为了调用点不必改。 */
function ensureAdSlot(){
  if((G.adUnlockLeft||0)<=0)return;
  if(lockedSlots().length)return;
  /* V6.4.7 旧版在这里无条件 G.slots.push({open:false}) 补一个新锁槽，动机是「让徽章不消失、
     玩家还能继续点」。实际后果：每解锁一次就多出一个可点的广告徽章 → 点一次开一格；
     又因为真机广告拉不到（见 unlockByAd 失败分支），看起来就是「无限白送台面槽」。
     现在改为不再补槽：广告额度用完或广告一直失败时，徽章自然消失。
     单关广告解锁总数由 CFG.adUnlockCap 硬限，玩家点不出无限个槽。*/
}
/* 还能不能解锁（免费那次 or 看广告）。徽章显示 / 命中 / 提示条全部以此为准，避免三处各写一套。 */
function canUnlock(){
  if(G.unlockLeft>0&&lockedSlots().length>0)return true;
  return (G.adUnlockLeft||0)>0&&lockedSlots().length>0;
}
function addUndo(){
  if(G.undoLeft>=9){toast('撤销次数已满');SFX.no();return;}
  G.undoLeft++; toast('撤销 +1！'); SFX.cap();
}
/* ---- 激励广告统一封装：游戏只描述「场景 + 收益」，广告细节全在 AdService ----
   这样做的好处（V4.0 §14）：换广告平台不改游戏逻辑；频控/幂等/埋点只写一处。 */
function adReward(scene,grant,fallback){
  if(G.adBusy)return false;
  G.adBusy=true;
  var done=function(){ G.adBusy=false; };
  var ok=AdService.showRewarded(scene,{
    onReward:function(){ done();
      if(AdService.mockSdk)toast('模拟广告：接口走通了，正式环境这里会播真实视频');
      if(grant)try{ grant('ad'); }catch(e){} },
    onCancel:function(){ done(); toast('要看完整段广告才算数哦'); SFX.no(); },
    onFail:function(){ done(); },
    onFallback:function(){ done(); if(fallback)try{ fallback(); }catch(e){} },
    onNotice:function(){ done(); toast('暂时没有广告，稍后再试'); SFX.no(); }
  });
  /* 文案改准：频控是「单次会话」级的，resetSession 全文件无调用，
     所以「下局再来」是句谎话 —— 换一局并不会重置，得等下一次会话。 */
  /* B：旧文案「换一局再来」是句假话 —— 频控是单次会话级的，resetSession 全文件无调用，
     换一局并不会重置。改成不打保票的说法。 */
  if(!ok){ G.adBusy=false; toast('广告次数用完啦，休息一下再来看'); SFX.no(); }
  return ok;
}
function toolLabel(id){
  for(var i=0;i<TOOLBS.length;i++)if(TOOLBS[i].id===id)return TOOLBS[i].label;
  return '道具';
}
/* 工具补次（P1 广告场景②）：额度 0 时点按钮 → 看广告补 1 次（非强制）。 */
function refillTool(id){
  adReward('tool_'+id,function(){
    G.tools[id]=(G.tools[id]||0)+1; persistTools();
    toast('\u770b\u5e7f\u544a\u8865\u4e86 1 \u6b21\u300c'+toolLabel(id)+'\u300d\uff01'); SFX.cap();
  },function(){
    Track.log('ad_tool_denied',{tool:id,reason:'ad_fail'});
    toast('\u5e7f\u544a\u6ca1\u52a0\u8f7d\u51fa\u6765\uff0c\u8fd9\u6b21\u6ca1\u8865\u6b21\u6570'); SFX.no();
  });
}
/* 撤销补次：额度 0 时点「撤销」→ 看广告补 1 次。 */
function refillUndo(){
  adReward('undo',function(){ G.undoLeft++; persistTools(); toast('\u770b\u5e7f\u544a\u8865\u4e86 1 \u6b21\u64a4\u9500\uff01'); SFX.cap(); },
    function(){ Track.log('ad_undo_denied',{reason:'ad_fail'}); toast('\u5e7f\u544a\u6ca1\u52a0\u8f7d\u51fa\u6765\uff0c\u8fd9\u6b21\u6ca1\u8865\u64a4\u9500'); SFX.no(); });
}
/* 「魔法清除」的补偿目标：台面上正接着这个颜色、还没接满的瓶子。
   清除会拿掉管底那一杯，这一杯直接倒进台面同色瓶里 —— 总量不变，
   所以每个瓶子永远 3 口（0% / 33% / 67% / 100%），绝不会出现 1/4 这种分母。
   找不到目标就拒绝清除：否则白扣一杯水，最后会变成「水没了瓶子还在」的死局。 */
function clearJarFor(col){
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.col===col&&b.place==='counter'&&!b.done&&b.fill<b.cap)return b;
  }
  return null;
}
function useClear(tubeIdx){
  var t=G.tubes[tubeIdx];
  if(!t.units.length){toast('这根管空了');SFX.no();return;}
  var col=t.units[0];
  var tgt=clearJarFor(col);
  if(!tgt){
    toast('这根管底是【'+colName(col)+'】，台面没有瓶在接它，先放一个'+colName(col)+'瓶上去');
    SFX.no();return;
  }
  snapshot();
  t.units.splice(0,1); t.drop=1;
  var cx=t.x+G.tubeW/2, cy=BOTT_Y-14-(G.uh||UH)/2;
  for(var p=0;p<20;p++)particles.push({x:cx,y:cy,vx:(Math.random()-0.5)*320,vy:(Math.random()-0.8)*320,g:500,life:0.8,age:0,col:COLORS[col],r:3+Math.random()*4});
  G.tools.clear--; persistTools(); G.mode=null; SFX.magic();
  G.moves++; G.toolsUsed++; Track.log('tool_use',{tool:'clear',env:AdService.env,mode:CFG.toolMode});
  tgt.fill++;                                  // 清掉的那杯水倒进同色瓶，一滴不浪费
  if(tgt.fill>=tgt.cap)completeJar(tgt);
  else toast('清掉管底 1 杯【'+colName(col)+'】，倒进了台面的'+colName(col)+'瓶，这根管就露出下一层');
}
function useClearAll(b){
  if(!b||b.place!=='counter'||b.done){toast('要点台面上正在接水的瓶子');SFX.no();return;}
  var col=b.col, room=b.cap-b.fill;                       // 这个瓶还能装几杯
  if(room<=0){toast('这个瓶已经装满了');SFX.no();return;}
  var pre=0;                                              // 先预演一遍：够不够吸，不够就别扣道具
  for(var pt=0;pt<G.tubes.length;pt++){ var pu=G.tubes[pt].units; for(var pi=0;pi<pu.length;pi++) if(pu[pi]===col)pre++; }
  if(pre<=0){toast('水管里已经没有【'+colName(col)+'】了');SFX.no();return;}
  snapshot();
  var got=0;
  for(var t=0;t<G.tubes.length&&got<room;t++){
    var u=G.tubes[t].units;
    for(var i=0;i<u.length&&got<room;){                   // 从最底层（i=0）开始往上一格格扫
      if(u[i]===col){
        var cx=G.tubes[t].x+G.tubeW/2, cy=BOTT_Y-14-(i+0.5)*(G.uh||UH);
        for(var p=0;p<10;p++)particles.push({x:cx,y:cy,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.8)*260,g:480,life:0.7,age:0,col:COLORS[col],r:2+Math.random()*3});
        u.splice(i,1); got++; G.tubes[t].drop=1;          // 抽走后上面的水自动下沉，索引不动
      } else i++;
    }
  }
  b.fill+=got; G.tools.clear--; persistTools(); G.mode=null; G.swapFirst=-1; G.swapFirstL=-1; SFX.magic();
  if(b.fill>=b.cap){ completeJar(b); toast('魔法清除：全场【'+colName(col)+'】吸了 '+got+' 杯，'+colName(col)+'瓶装满飞走，空出一个台面槽'); }
  else toast('魔法清除：全场【'+colName(col)+'】吸了 '+got+' 杯（'+b.fill+'/'+b.cap+'），压在上面的那几杯也一起抽走了');
  G.moves++; G.toolsUsed++; Track.log('tool_use',{tool:'clear_all',env:AdService.env,mode:CFG.toolMode}); }
function useSwap(i,j){ useSwapLayer(i,0,j,0); }
function useSwapLayer(i,li,j,lj){
  if(i===j&&li===lj){toast('同一格不用换');SFX.no();return;}
  var a=G.tubes[i],b=G.tubes[j];
  if(!a.units.length||!b.units.length){toast('这两格得都有水才能换');SFX.no();return;}
  if(li>=a.units.length||lj>=b.units.length){toast('最上面那一格没有水了，换下面还有水的');SFX.no();return;}
  snapshot();
  var _s1=a.units[li],_s2=b.units[lj]; a.units[li]=_s2; b.units[lj]=_s1;
  a.drop=1;b.drop=1;
  G.tools.swap--; persistTools(); G.mode=null; G.swapFirst=-1; G.swapFirstL=-1; SFX.magic();
  toast(i===j ? ('互换：这根管把【'+colName(_s1)+'】换到了管底，现在能接【'+colName(a.units[0])+'】') : ('互换：【'+colName(_s1)+'】↔【'+colName(_s2)+'】换了位置'));
  G.moves++; G.toolsUsed++; Track.log('tool_use',{tool:'swap',env:AdService.env,mode:CFG.toolMode}); }
/* ---- 隐藏选关（测试用）：入口=左上角「关卡 N」2.5 秒内连点 5 次。 ---- */
var LV_PANEL={
  px:50, py0:265, pw:620, ph:900,
  bx:84, by:382, bw:104, bh:76, gap:8,
  pgy:898, pgh:62, bbx:84, bbw:164, nbx:472, nbw:164,
  ry:966, rh:54, rw:586,
  ey:1028, eh:56, ex1:84, ex2:282, ex3:480, ew:190,

};
var LV_PER_PAGE=30, LV_PAGES=Math.ceil(CFG.maxLevel/LV_PER_PAGE);   // 页数随关卡上限走，不再写死 3
/* 广告环境切换：藏在本面板（连点5次才开），玩家碰不到；降级时必须说出原因。 */
var ENV_DEGRADE_TXT={'no-tap-runtime':'没检测到 TapTap SDK（不在 TapTap 容器内）',

function lvPickTap(vx,vy){
  var P=LV_PANEL, pg=G.lvPickPage||0;
  for(var i=0;i<LV_PER_PAGE;i++){
    var r=(i/5)|0, c=i%5;
    var bx=P.bx+c*(P.bw+P.gap), by=P.by+r*(P.bh+P.gap);
    if(vx>=bx&&vx<=bx+P.bw&&vy>=by&&vy<=by+P.bh){
      var n=pg*LV_PER_PAGE+i+1;
      G.lvPick=false; genLevel(n); return;
    }
  }
  if(vy>=P.pgy&&vy<=P.pgy+P.pgh){
    if(vx>=P.bbx&&vx<=P.bbx+P.bbw){if(pg>0)G.lvPickPage=pg-1;SFX.tap();return;}
    if(vx>=P.nbx&&vx<=P.nbx+P.nbw){if(pg<LV_PAGES-1)G.lvPickPage=pg+1;SFX.tap();return;}
  }
  /* 广告环境切换（TEST 模拟看完 / ONLINE 真实 SDK）。坐标与下方绘制共用 LV_PANEL，
     画的和点的必须是同一套，否则又是一个「看得见点不到」。 */
  if(vy>=P.ry&&vy<=P.ry+P.rh&&vx>=P.ex1&&vx<=P.ex1+P.rw){CFG.toolResetEach=!CFG.toolResetEach;SFX.tap();toast('每关重置(下一关生效)：'+(CFG.toolResetEach?'开 · 撤销每关补满1':'关 · 额度跨关持久'));return;}
  if(vy>=P.ey&&vy<=P.ey+P.eh){
    if(vx>=P.ex1&&vx<=P.ex1+P.ew){setEnvUI('test');return;}
    if(vx>=P.ex2&&vx<=P.ex2+P.ew){setEnvUI('mock');return;}
    if(vx>=P.ex3&&vx<=P.ex3+P.ew){setEnvUI('online');return;}

function boardPlayable(){
  if(G.state!=='play')return false;
  var bottoms=tubeBottomSet(),i;
  var canDrink=false,gridReady=false;
  for(i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];

    else if(b.place==='grid'&&!b.locked&&gridPlayable(b))gridReady=true;
  }
  if(canDrink)return true;
  if(gridReady&&counterCount()<openSlotCount())return true;      // 能放瓶上台面
  if(G.tools.clear>0&&clearTargetExists())return true;
  if(G.tools.swap>0&&G.tubes.length>1)return true;
  if(G.tools.finger>0&&gridReady)return true;
  /* V6.4.6：这里只看**免费**解锁。广告解锁是外部资源，算进来的话 adUnlockLeft 初始=2

  if(G.unlockLeft>0&&openSlotCount()<G.slots.length)return true;

/* 「还能不能做出一个合法有效的决策」—— 失败的判定标准，也是复活后的验收标准 */
function hasLegalDecision(){

    for(i=0;i<s.tubes.length;i++){var u=s.tubes[i];if(u&&u.length)bottoms[u[0]]=1;}
    var counter=0,open=0,gridLeft=0;
    for(i=0;i<s.bottles.length;i++){
      var b=s.bottles[i];
      if(b.place==='counter'){ counter++; if(b.fill<b.cap&&bottoms[b.col])return true; }
      else if(b.place!=='gone')gridLeft++;
