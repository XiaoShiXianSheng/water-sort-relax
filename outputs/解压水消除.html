  }
  if(counterDrink){G.hint=false;return;}                    // 台面上还有瓶在喝 → 一切正常

  var fs=freeSlot();
  var canAct=fs>=0                                       // 有空槽可以放
    ||(G.undoLeft>0&&counterIdle)                        // 能退回一瓶腾位置
    ||(G.unlockLeft>0&&lockedSlots().length>0);          // V6.4.6：同上，死局判定只认免费解锁

  /* 掏门洞 / 解冻也算推进：只要能把堵着的那瓶搬上台面，后面的就露出来了。 */
  var gateWaiting=false,iceWaiting=false;
  var fzSet={},fzCells=[];
  for(var fz0=0;fz0<G.bottles.length;fz0++){
    var fb0=G.bottles[fz0];
    if(fb0.locked>0&&fb0.place==='grid'&&!fzSet[fb0.cell]){fzSet[fb0.cell]=1;fzCells.push(fb0.cell);}
  }
  for(var k=0;k<G.bottles.length;k++){
    var pb=G.bottles[k];
    if(pb.place!=='grid'||pb.locked>0||!gridPlayable(pb))continue;
    if(pb.gate>=0&&gateRest(pb.gate)>1)gateWaiting=true;
    for(var fk=0;fk<fzCells.length;fk++){
      if(cellsAdjacent(pb.cell,fzCells[fk])){iceWaiting=true;break;}
    }
    if(gateWaiting&&iceWaiting)break;
  }

  /* 软提示（不挡操作）：台面上有瓶子但一瓶都喝不到 → 直接告诉玩家怎么办。
     要「卡住持续 1 秒」才弹，避免瓶子刚喝完、下一口马上开始的瞬间闪一下。
     FIX-04：光给文字等于让玩家自己去底部工具栏里找按钮 —— 文案说的位置和可点的位置
     是分离的（就是玩家反馈的那句「弹的是可以撤销提示」）。现在直接把能用的动作
     做成按钮，按钮就在文案下面，点得到、看得见。 */
  var wantHint=counterHas&&(fs<0||!gridDrink);
  G.hintHold=wantHint?((G.hintHold||0)+(G.dt||0.016)):0;
  if(wantHint&&G.hintHold>=1.0){
    var fixTxt=(G.tools.swap>0)?'点「随心互换」换换管底，或点「撤销」退回一瓶'
      :(G.undoLeft>0?'点「撤销」退回一瓶，再换个能喝的瓶子上来'
      :canUnlock()?'点台面右边「解锁」再加一个槽位（免费那次用完了可以看广告），或「重开」本关'
      :'点「重开」重开本关');
    G.hint=gridDrink?{a:'台面满了，但瓶子都接不到水',b:'退回一瓶再放能喝的上来，或点「重开」换一局'}
                    :{a:'台面上的瓶子都接不到水了',b:fixTxt};
    G.hint.opts=hintOpts();
  }else G.hint=false;

  /* 硬死局（弹失败面板）：连一点求生手段都没有了 */
  var clearOK=false;
  if(waterTotal>0){
    for(var ct=0;ct<G.tubes.length;ct++){
      var cu=G.tubes[ct].units;
      if(cu.length&&clearJarFor(cu[0])){clearOK=true;break;}
    }
  }
  /* 货架层兜底自检：一旦货架上出现「掏不出来的环」（洞口与冰冻瓶互锁），
     那些瓶子永远上不了台面 → 本关不可能通关，且任何道具都救不了。
     这种局面必须直接判失败，不能让玩家对着一个走不动的棋盘干等。 */
  if(!layoutSolvable()){ G.hint=false; enterFail('unsolvable'); return; }

  var escape=((gridDrink||gateWaiting||iceWaiting)&&canAct)
    ||(G.tools.clear>0&&clearOK)
    ||(G.tools.swap>0&&G.tubes.length>1&&waterTotal>0);
  /* 注意：复活次数不算「逃生手段」—— 没有合法操作就是真失败，
     复活是失败的应对方式，而不是否认真失败的理由（否则玩家会对着死棋盘干等）。 */
  if(!escape)enterFail('exhausted');
}
function useFinger(){
  if(G.anim)return;
  /* 先把「台面还有没有位置」问清楚再扣道具：以前是先 -- 再 startPlace，
     而 startPlace 在台面满时会直接 return —— 结果道具没了、瓶子没动、还白挨一条横幅。 */
  if(freeSlot()<0){toast('台面满了，先退回一个瓶子');SFX.no();return;}
  var bottoms=G.tubes.map(function(t){return bottomOf(t);});
  var b=null;
  for(var i=0;i<G.bottles.length;i++){
    var bb=G.bottles[i];
    if(bb.place==='grid'&&!bb.locked&&bottoms.indexOf(bb.col)>=0&&gridPlayable(bb)){b=bb;break;}
  }
  if(!b){toast('现在没有能直接放上台面的瓶子，等管底出现同色水再点');SFX.no();return;}
  G.tools.finger--; persistTools(); SFX.magic();
  toast('万能指：把【'+colName(b.col)+'】瓶放上台面，它马上能接到水');
  G.toolsUsed++; Track.log('tool_use',{tool:'finger',env:AdService.env,mode:CFG.toolMode});
  startPlace(b);
}

/* ================= 输入 ================= */
function toVirtual(cx,cy){return {x:(cx-offX)/scale,y:(cy-offY)/scale};}
function tubeAt(vx,vy){
  for(var i=0;i<G.tubes.length;i++){
    var t=G.tubes[i],ty=BOTT_Y-t.h;
    if(vx>=t.x-8&&vx<=t.x+G.tubeW+8&&vy>=ty-10&&vy<=BOTT_Y+16)return i;
  }
  return -1;
}
function unitAt(vx,vy){
  var t0=tubeAt(vx,vy); if(t0<0)return null;
  var t=G.tubes[t0],UH=G.uh||36,by=BOTT_Y-14;
  for(var i=0;i<t.units.length;i++){ var yTop=by-(i+1)*UH, yBot=by-i*UH; if(vy>=yTop&&vy<=yBot)return{t:t0,l:i}; }
  return{t:t0,l:0};
}
function bottleAtGrid(vx,vy){
  var best=null,bd=1e9;
  /* 命中盒跟着格子缩：高关卡格子只有 56px（旧版 124），
     继续用写死的 ±52/±66 会让相邻瓶子的命中区互相重叠一大半 ——
     虽然下面用「取离手指最近的那个」兜底，但斜着点就会串到隔壁瓶。
     这里把半宽收到「格子 + 间距 的一半」，相邻命中区正好相切、不重叠。 */
  var hw=Math.min(52,(G.tile+GX)*0.5);
  var vUp=Math.min(66,(G.bh||65)+24), vDn=Math.min(56,G.tile*0.5+30);
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.place!=='grid')continue;
    if(b.gate>=0&&!gateFront(b))continue;                 // 藏在洞里的瓶子点不到
    if(vx>=b.x-hw&&vx<=b.x+hw&&vy>=b.y-vUp&&vy<=b.y+vDn){
      var dx=vx-b.x,dy=vy-(b.y-20),d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=b;}                              // 命中多个时取离手指最近的那个
    }
  }
  return best;
}
function jarAtCounter(vx,vy){
  /* 同样跟着槽间距缩：17 个槽时间距只有 41px，±44 会让左右两个槽都命中 */
  var hw=Math.min(44,(G.slotStep||112)*0.55);
  var vUp=Math.min(96,(G.jh||86)+14);
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.place!=='counter')continue;
    if(vx>=b.x-hw&&vx<=b.x+hw&&vy>=b.y-vUp&&vy<=b.y+8)return b;
  }
  return null;
}
function lockedSlots(){var a=[];for(var s=0;s<G.slots.length;s++)if(!G.slots[s].open)a.push(s);return a;}
function unlockBadgeAt(v){
  var ls=lockedSlots(); if(!ls.length||!canUnlock())return false;
  var sx=G.slotX[ls[ls.length-1]],dx=v.x-sx,dy=v.y-(SLOT_Y-52);
  var r=Math.min(54,(G.slotStep||112)*0.6);
  return dx*dx+dy*dy<r*r;
}
function toolAt(v){
  if(v.y<TOOL_Y||v.y>TOOL_Y+TOOL_H)return -1;
  for(var i=0;i<TOOLBS.length;i++){
    var x=toolX(i);
    if(v.x>=x&&v.x<=x+TOOL_W)return i;
  }
  return -1;
}
function startFromTitle(){
  var lv=URL_LVL||Math.max(1,Store.get('level',1)||1);   // 有存档就从上次进度继续
  if(lv>CFG.maxLevel)lv=CFG.maxLevel;                    // 存档越界（旧版溢出到 91+）夹回上限
  genLevel(lv);
}
function handleTap(cx,cy){
  ac();
  var v=toVirtual(cx,cy),vx=v.x,vy=v.y;
  /* 选档面板：模态，最高优先级 —— 必须排在 G.state 的所有分支之前。
     ⚠ 它由结算页的「再挑战本关」打开，而那一刻 G.state 仍是 'win'；
     若放在 win 分支之后，点击会先在 win 分支被 return 掉，永远走不到这里（面板点不动）。 */
  if(G.tierPick){
    for(var tp=0;tp<TIER_UI.rows.length;tp++){
      var row=TIER_UI.rows[tp];
      if(vx>=120&&vx<=600&&vy>=row.y&&vy<=row.y+92){
        if(tierUnlocked(G.level,row.id)){ G.tierPick=false; genLevel(G.level,{tier:row.id}); }
        else { toast('先通关上一档才能解锁「'+TIER_NAME[row.id]+'」'); SFX.no(); }
        return;
      }
    }
    if(inBox(TIER_UI.close,vx,vy)){ G.tierPick=false; SFX.tap(); return; }
    return;                                                // 点面板外：吃下点击，不穿透到结算页
  }
  if(G.state==='title'){
    if(inBox(TITLE_UI.start,vx,vy)){ startFromTitle(); return; }
    if(inBox(TITLE_UI.daily,vx,vy)){ startDaily(); return; }
    startFromTitle();                                     // 点空白处 = 继续上次进度
    return;
  }
  if(G.state==='win'){
    if(inBox(WIN_UI.next,vx,vy)){
      closeWinAndInterstitial(function(){
        if(G.daily)startDaily();
        else if(G.level<CFG.maxLevel) genLevel(G.level+1);
        else goHome();   // 已是最后一关：不生成 91+，回首页
      });
      return;
    }
    if(inBox(WIN_UI.challenge,vx,vy)){ G.tierPick=true; SFX.tap(); return; }
    if(inBox(WIN_UI.home,vx,vy)){ closeWinAndInterstitial(goHome); return; }
    /* 结算弹窗里的两档方块（与 drawWinPanel 的几何一一对应）：不是纯展示 ——
       点它可以换档重开。当前档只给引导不重开（否则又变成「点了却回到本关」）。 */
    for(var tw=0;tw<2;tw++){
      var tbx=240+tw*240;
      if(vx>=tbx-58&&vx<=tbx+58&&vy>=712&&vy<=780){
        if(!tierUnlocked(G.level,tw)){ toast('先通关上一档才能解锁「'+TIER_NAME[tw]+'」'); SFX.no(); }
        else if(tw===G.tier){ toast('当前就是「'+TIER_NAME[tw]+'」档，点「再挑战本关」可重开'); }
        else { genLevel(G.level,{tier:tw}); }
        return;
      }
    }
    return;
  }
  if(G.state!=='play')return;
  if(G.fail){                                             // 失败面板（模态，含缓冲期）
    if(G.fail.t<0.6)return;                               // 情绪缓冲：短到不烦人，长到不误触
    for(var si=0;si<FAIL_OPTS.length;si++){
      var so=FAIL_OPTS[si];
      /* 「撤销一瓶」要 1.5 秒后才淡入：淡入完成前它既没画出来，也点不到 */
      if(so.id==='undo'&&failUndoAlpha()<=0)continue;
      if(vx>=100&&vx<=620&&vy>=so.y&&vy<=so.y+so.h){ failAction(so.id); return; }
    }
    return;
  }
  if(G.anim){
    /* 以前这里在「放置/退回」动画期间(0.42~0.5 秒)把点击直接丢掉 —— 玩家连点就觉得「点不动」。
       现在先让当前动画立刻落定，再继续处理这一次点击，输入永不被吞。
       只有「满瓶庆祝」这类不可打断的动画才让本次点击作废。 */
    if(G.anim.type==='drink')finishDrink(); else snapAnim();
    if(G.anim)return;
  }
  /* 软提示条上的真按钮（FIX-04）：几何与 drawHint 共用 hintRects()，画哪点哪 */
  if(G.hint&&hintTap(vx,vy))return;
  // 隐藏选关面板（测试用）：模态，先吃掉所有点击
  if(G.lvPick){lvPickTap(vx,vy);return;}
  // 左上角「关卡 N」连续点 5 次（2.5 秒内）→ 打开隐藏选关
  if(vx>=20&&vx<=190&&vy>=28&&vy<=88){
    if(G.t-(G.lvTap.t||0)>2.5)G.lvTap.n=0;
    G.lvTap.t=G.t; G.lvTap.n++;
    if(G.lvTap.n>=5){G.lvTap.n=0;G.lvPick=true;G.lvPickPage=Math.max(0,Math.floor((G.level-1)/30));SFX.cap();}
    else{SFX.tap();}          // 不给计数提示：玩家好奇连点会看见「（测试）」这种内部字样
    return;
  }
  // HUD 重开
  /* HUD「重开」必须带上 daily/date/seed：以前裸调 genLevel(G.level)，
     每日挑战中途点重开会被静默降级成普通关（徽标消失、结算不记当天成绩，玩家毫无察觉）。
     同时补上 restart:1 —— 失败面板的重开是记重开的，HUD 重开不能免责。 */
  if(vx>=590&&vx<=700&&vy>=28&&vy<=88){
    genLevel(G.level,{restart:1,daily:G.daily,date:G.dailyDate,
      tier:G.daily?0:undefined,seed:G.daily?dailySeed(G.dailyDate):undefined});
    return;
  }
  // 底部工具栏（三个道具 + 撤销 + 分享）
  var ti0=toolAt(v);
  if(ti0>=0){
    var tb=TOOLBS[ti0],id=tb.id;
    if(id==='undo'){
      if(G.mode==='return'){G.mode=null;SFX.tap();return;}
      // 台面上有瓶子 → 进入「选瓶退回」模式；否则就是撤销上一步
      var hasJar=false;
      for(var hj=0;hj<G.bottles.length;hj++)if(G.bottles[hj].place==='counter')hasJar=true;
      if(hasJar&&G.undoLeft>0){
        G.mode='return';G.swapFirst=-1;G.swapFirstL=-1;toast('点台面上的瓶子，把它放回格子');SFX.tap();
      }else if(G.undoLeft<=0){
        refillUndo();                                  // 撤销用尽 → 看广告补 1 次（非强制）
      }else{
        doUndo();
      }
      return;
    }
    /* V6.4.12：额度 0 → 看广告补 1 次（用户口径：点它 → 看广告 → 然后就能用）。
       与对标一致：上来是 0/0/0/1，想用道具就得先看一次激励视频。 */
    if(G.tools[id]<=0){ refillTool(id); return; }
    if(id==='clear'){
      if(G.mode==='clear'){G.mode=null;G.swapFirst=-1;G.swapFirstL=-1;toast('');SFX.tap();return;}
      G.mode='clear';G.swapFirst=-1;G.swapFirstL=-1;
      toast(clearTargetExists()?'点台面某个颜色的瓶子：把水管里这个颜色全吸过来（点【绿框】水管则只清管底那杯）':'先放一个瓶子上台面接水，管底的水才有地方倒');
      SFX.tap();return;
    }
    else if(id==='swap'){G.mode=(G.mode==='swap')?null:'swap';G.swapFirst=-1;G.swapFirstL=-1;toast(G.mode?'依次点两格水（同一根管也行），这两格换位置':'');SFX.tap();}
    else useFinger();
    return;
  }
  // 台面上的瓶子：只有先点「撤销」进入退回模式才能拿下来
  var jb=jarAtCounter(vx,vy);
  if(jb){
    if(G.mode==='clear'){useClearAll(jb);return;}
    if(G.mode==='swap'){
      toast('现在要点的是【上面那排水管】，再点另一根');
      SFX.no();return;
    }
    if(G.mode==='return'){
      if(G.undoLeft<=0){G.mode=null;toast('没有撤销次数了');SFX.no();return;}
      G.undoLeft--; G.mode=null; startReturn(jb);
    }else{
      toast('要放回格子？先点底部「撤销」');SFX.no();
    }
    return;
  }
  // 台面最右侧的广告解锁徽章
  if(unlockBadgeAt(v)){unlockSlot();return;}
  // 交换模式：选管
  if(G.mode==='swap'){
    var hit=unitAt(vx,vy);
    if(hit){
      if(G.swapFirst<0){G.swapFirst=hit.t;G.swapFirstL=hit.l;SFX.tap();toast('再点一格水：这两格换位置（同一根管的上、下两层也行）');}
      else if(G.swapFirst===hit.t&&G.swapFirstL===hit.l){G.swapFirst=-1;G.swapFirstL=-1;SFX.tap();}
      else{useSwapLayer(G.swapFirst,G.swapFirstL,hit.t,hit.l);}
      return;
    }
  }
  // 清除模式：选管
  if(G.mode==='clear'){
    var tc=tubeAt(vx,vy);
    if(tc>=0){useClear(tc);return;}
  }
  // 底部瓶子
  var gb=bottleAtGrid(vx,vy);
  if(gb){
    if(gb.locked>0){
      gb.shake=0.5;                      // 抖一下：让玩家确认「点到了，但这瓶冻着」
      toast('冰冻中：上下左右任意两格清空就自动解冻');SFX.no();
      return;
    }
    if(gateBlocked(gb)){
      gb.shake=0.5;
      toast('洞口被挡住了：先把它'+gateDirName(gb)+'边那一格的瓶子拿走');SFX.no();
      return;
    }
    startPlace(gb);return;
  }
  // 空点取消模式
  if(G.mode){G.mode=null;G.swapFirst=-1;G.swapFirstL=-1;}
}

/* ================= 门洞 / 冰冻瓶 规则 ================= */
function cellOccupied(cell){
  if(cell<0)return false;
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.place==='grid'&&b.cell===cell)return true;
  }
  return false;
}
/* 邻格是否为空（界外一律算空）—— 冰冻瓶解冻靠它 */
function neighborEmpty(cell,d){var nc=neighborCell(cell,d);return nc<0?true:!cellOccupied(nc);}
/* 冰冻瓶解冻：上下左右四个方向里，任意两格是空的就自动解冻（不再只是左右两格） */
function thawByNeighbors(){
  if(G.state!=='play')return;
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.locked<=0||b.place!=='grid')continue;
    var n=0;
    for(var d=0;d<4;d++)if(neighborEmpty(b.cell,d))n++;
    if(n>=2){
      b.locked=0;
      for(var p=0;p<14;p++)particles.push({x:b.x,y:b.y-40,vx:(Math.random()-0.5)*260,vy:-Math.random()*260,g:500,life:0.6,age:0,col:'#bfe3ff',r:2+Math.random()*3});
      toast('上下左右空出两格，冰冻解除！');SFX.cap();
    }
  }
}
/* ---- 门洞：洞里塞多个瓶子，只能按顺序取，洞口那一侧被挡就拿不出来 ---- */
function gateAt(cell){
  for(var g=0;g<G.gates.length;g++)if(G.gates[g].cell===cell)return g;
  return -1;
}
function gateRest(gi){          // 洞里还剩几个瓶子
  var n=0;
  for(var i=0;i<G.bottles.length;i++){var b=G.bottles[i];if(b.gate===gi&&b.place==='grid')n++;}
  return n;
}
function gateFront(b){          // 是不是该洞里排在最前面的那个（只有它能取）
  if(!(b.gate>=0))return true;
  var m=999;
  for(var i=0;i<G.bottles.length;i++){
    var x=G.bottles[i];
    if(x.gate===b.gate&&x.place==='grid'&&x.q<m)m=x.q;
  }
  return b.q<=m;
}
function gateMouthCell(gi){   // 洞口朝向的邻格；-1 = 朝界外，永远通
  var g=G.gates[gi];
  return g?neighborCell(g.cell,g.dir):-1;
}
function gateBlocked(b){        // 洞口被别的瓶子挡住 → 取不出来
  if(!(b.gate>=0))return false;
  var mc=gateMouthCell(b.gate);
  if(mc<0)return false;
  return cellOccupied(mc);
}
function gateDirName(b){return DIRS[G.gates[b.gate].dir].name;}
function iceAt(cell){           // 该格是不是冻着瓶子（门洞朝向要避开它）
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.place==='grid'&&b.cell===cell&&b.locked>0)return true;
  }
  return false;
}
/* ---- 静态可解性自检（剥落模拟）：回答「货架上的瓶子能不能靠掏洞+解冻全搬下来？」
   故意**不管**水管空间和台面槽位 —— 那些只是资源，能靠喝水/撤回腾出来，不是死锁。
   做法就是一局游戏的最简模拟：反复把「此刻拿得出来的瓶子」移除，直到再也找不出来；
   若还剩瓶子，说明存在环。真实踩到的环长这样（用户第 8 关实测）：
       三个门洞都朝着中间那格 → 洞要等中间那格空出来才通；
       而中间那格是冰冻瓶，解冻要等四邻空出 2 格 → 得先掏门洞。两边互等，谁也动不了。
   生成关卡时用它把关（不合格就重掷），运行时用它兜底判死局。 */
function layoutSolvable(){
  var occ={},rest={},frozen={},nxt={},i,key;
  for(i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.place!=='grid')continue;               // 已经上台面/已完成的不占货架
    occ[b.cell]=1;
    if(b.gate>=0)rest[b.gate]=(rest[b.gate]||0)+1;
    if(b.locked>0)frozen[b.cell]=1;
  }
  /* 洞里按 q 从小到大取 —— 起始值必须是「洞里现在还剩下的最小 q」。
     不能写死 0：一局进行到一半时，最前面那个瓶子早就被取走上台面了，
     剩下的 q>0，若还从 0 等起就永远匹配不上，会把正常局面误判成死锁。 */
  for(i=0;i<G.bottles.length;i++){
    var b0=G.bottles[i];
    if(b0.place==='grid'&&b0.gate>=0&&(nxt[b0.gate]===undefined||b0.q<nxt[b0.gate]))nxt[b0.gate]=b0.q;
  }
  var changed=true;
  while(changed){
    changed=false;
    for(key in frozen){                          // 解冻：四邻里空出 2 格就化开
      var fn=0;
      for(var d=0;d<4;d++){var nc=neighborCell(+key,d);if(nc<0||!occ[nc])fn++;}
      if(fn>=2){delete frozen[key];changed=true;}
    }
    for(i=0;i<G.bottles.length;i++){
      var b2=G.bottles[i];
      if(b2.place!=='grid'||!occ[b2.cell]||frozen[b2.cell])continue;
      if(b2.gate>=0){
        if(b2.q!==nxt[b2.gate])continue;         // 洞里只能先取最前面那个
        var mc=neighborCell(G.gates[b2.gate].cell,G.gates[b2.gate].dir);
        if(mc>=0&&occ[mc])continue;              // 洞口被别的瓶子挡着
        nxt[b2.gate]++; rest[b2.gate]--;
        if(rest[b2.gate]<=0)delete occ[G.gates[b2.gate].cell];   // 洞掏空 → 这格才算空
        changed=true;
      }else{
        delete occ[b2.cell];changed=true;
      }
    }
  }
  for(key in occ)return false;                   // 还剩瓶子搬不下来 = 死锁
  return true;
}

    var n=b.cap||3;

    var tw2=n*cw+(n-1)*3*s2, sx0=x-tw2/2;

/* 门洞里剩下的瓶子：叠着画，每个都露出自己的颜色（最前面那个在最上面）
   + 洞口朝向上的箭头（红=被挡 / 黄=通） + 剩余数量 ×N */
function drawGateBottles(gi,rc,time){
  var list=[];
  for(var i=0;i<G.bottles.length;i++){
    var b=G.bottles[i];
    if(b.gate===gi&&b.place==='grid')list.push(b);
  }
  list.sort(function(a,b){return a.q-b.q;});
  var cx=rc.x+rc.w/2, cy=rc.y+rc.h/2+10;
  var show=Math.min(list.length,3);
  /* 叠放错位「跟着格子大小走」：格子小的时候 13px 够用，格子大了（131）还按 13 就会挤成一坨。
     基准再乘 0.88 —— 洞里要塞 2~3 个瓶子，必须比独占一格的瓶子略小，才叠得开、也看得清各自颜色。 */
  var step=Math.max(14,rc.h*0.20);
  for(var k=show-1;k>=0;k--){
    var off=k*step;
    drawBottle(list[k],time,{x:cx-off*0.5,y:cy-off*0.95,sc:(1-k*0.10)*0.88,alpha:k===0?1:0.97,ice:false});
  }
  if(!list.length){
    ctx.font='bold 18px '+FONT;ctx.textAlign='center';ctx.fillStyle='rgba(255,235,200,0.4)';
    ctx.fillText('空',cx,rc.y+rc.h/2+6);
  }
  // 洞口朝向箭头：画在洞口外侧，永远指向货架里的邻格（红=被挡，黄=通）
  var g=G.gates[gi], d=DIRS[g.dir];
  var mx=gateMouthCell(gi), blocked=(mx>=0&&cellOccupied(mx));
  var ax,ay;
  /* 箭头画在「格子内侧那一边」—— 原来画在格子外面 13px，半径 13 的圆会压到隔壁格子/邻居瓶子上，
     正是「堆叠这么靠近」的来源之一。放回格内一样能表示朝向，还不干扰邻格。 */
  if(g.dir===0){ax=cx;ay=rc.y+12;}
  else if(g.dir===2){ax=cx;ay=rc.y+rc.h-12;}
  else if(g.dir===1){ax=rc.x+rc.w-12;ay=rc.y+rc.h/2;}
  else{ax=rc.x+12;ay=rc.y+rc.h/2;}
  ctx.beginPath();ctx.arc(ax,ay,11,0,7);
  ctx.fillStyle=blocked?'rgba(255,90,80,0.95)':'rgba(255,205,90,0.95)';ctx.fill();
  ctx.strokeStyle='rgba(40,22,8,0.75)';ctx.lineWidth=2;ctx.stroke();
  var as=9;
  ctx.beginPath();
  if(d.dy<0){ctx.moveTo(ax,ay-as);ctx.lineTo(ax-as*0.85,ay+as*0.7);ctx.lineTo(ax+as*0.85,ay+as*0.7);}
  else if(d.dy>0){ctx.moveTo(ax,ay+as);ctx.lineTo(ax-as*0.85,ay-as*0.7);ctx.lineTo(ax+as*0.85,ay-as*0.7);}
  else if(d.dx>0){ctx.moveTo(ax+as,ay);ctx.lineTo(ax-as*0.7,ay-as*0.85);ctx.lineTo(ax-as*0.7,ay+as*0.85);}
  else{ctx.moveTo(ax-as,ay);ctx.lineTo(ax+as*0.7,ay-as*0.85);ctx.lineTo(ax+as*0.7,ay+as*0.85);}
  ctx.closePath();
  ctx.fillStyle='#fff';ctx.fill();
  // 洞里还剩几个瓶子
  var rest=gateRest(gi);
  rr(ctx,rc.x+rc.w-40,rc.y+rc.h-30,34,25,9);
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fill();
  ctx.strokeStyle='rgba(255,233,168,0.8)';ctx.lineWidth=2;ctx.stroke();
  ctx.font='bold 18px '+FONT;ctx.textAlign='center';ctx.fillStyle='#ffe9a8';
  ctx.fillText('×'+rest,rc.x+rc.w-23,rc.y+rc.h-12);
  ctx.textAlign='center';
}
/* ---- 软提示条几何：绘制与命中**共用这一份** --------------------------------
   本项目出过「画的和点的是两套坐标」的 bug，所以按钮矩形只允许从 hintRects() 出，
   drawHint 和 hintTap 都不许自己再算一遍。
   纵向范围锁在 498 ~ 632：上面 486 是水管命中盒的下沿（不能压水管），
   下面 614 起是台面瓶子的瓶身（按钮最多压到瓶口一点点，货架在 766 以下，碰不到）。 */
var HINT_Y0=498, HINT_TXT_H=92, HINT_BTN_TOP=72, HINT_BTN_H=52, HINT_BTN_PAD=14, HINT_BTN_GAP=10;
function hintRects(){
  var h=G.hint;
  if(!h)return null;
  ctx.save();
  ctx.font='bold 26px '+FONT;
  var w1=ctx.measureText(h.a||'').width;
  ctx.font='23px '+FONT;
  var w2=ctx.measureText(h.b||'').width;
  ctx.restore();
  var tw=Math.min(VW-40,Math.max(w1,w2)+92);
  var x0=(VW-tw)/2;
  var opts=(h.opts&&h.opts.length)?h.opts:null;
  var out={x:x0,y:HINT_Y0,w:tw,h:(opts?(HINT_BTN_TOP+HINT_BTN_H+10):HINT_TXT_H),btns:[]};
  if(opts){
    var n=Math.min(4,opts.length);
    var bw=(tw-HINT_BTN_PAD*2-HINT_BTN_GAP*(n-1))/n;
    for(var i=0;i<n;i++){
      out.btns.push({id:opts[i].id,enabled:!!opts[i].enabled,opt:opts[i],
        x:x0+HINT_BTN_PAD+i*(bw+HINT_BTN_GAP),y:HINT_Y0+HINT_BTN_TOP,w:bw,h:HINT_BTN_H});
    }
  }
  return out;
}
/* 「手指落在哪个按钮上」—— 纯查询，不执行动作。
   和 hintTap 分开是因为：命中判定必须能被反复探（测试要挨个验证「画在这、点得到」），
   而 tap 一探就把按钮按下去了，探第二个时局面已经变了。 */
function hintHit(vx,vy){
  var r=hintRects();
  if(!r)return null;
  for(var i=0;i<r.btns.length;i++){
    var t=r.btns[i];
    if(vx>=t.x&&vx<=t.x+t.w&&vy>=t.y&&vy<=t.y+t.h)return t;
  }
  return null;
}
/* 命中：命中框与 hintRects() 出来的矩形**逐像素同一份**，不另设一套 */
function hintTap(vx,vy){
  var t=hintHit(vx,vy);
  if(!t)return false;                             // 按钮以外照旧穿透（提示条不挡操作）
  if(!t.enabled){ toast('这个现在用不了'); SFX.no(); return true; }
  hintAction(t.id);
  return true;
}
function hintAction(id){
  G.hint=false; G.hintHold=0;

  if(id==='swap'){ G.mode='swap'; G.swapFirst=-1; G.swapFirstL=-1; toast('依次点两格水（同一根管也行），这两格换位置'); SFX.magic(); return; }

  if(id==='unlock'){ unlockSlot(); return; }

  if(G.mode){
    var hintTxt=G.mode==='clear'?'✨ 点一根水管清除底层'
      :(G.mode==='swap'?'🔄 依次点两根水管交换底层'
      :(G.mode==='return'?'↩ 点台面上的瓶子，把它放回格子':''));
    if(hintTxt){ctx.font='bold 26px '+FONT;ctx.fillStyle='#b06a1e';ctx.fillText(hintTxt,VW/2,590);}
  }
  if(G.hint&&!G.fail&&!G.tierPick)drawHint(time);
  /* 醒目横幅：停在台面正上方（比 toast 大得多 + 左右抖），
     专治「点了没反应」—— 小 toast 在 HUD 下方，玩家常常根本没看到。 */
  if(G.warn&&!G.lvPick){
    var wA=Math.max(0,Math.min(1,G.warn.t*6)*Math.min(1,(1.8-G.warn.t)*3));
    if(wA>0){
      ctx.save();
      ctx.globalAlpha=wA;
      var wob=Math.sin(time*22)*5;
      ctx.font='bold 28px '+FONT;
      var ww=ctx.measureText('⚠ '+G.warn.msg).width+56;
      if(ww>VW-30)ww=VW-30;
      rr(ctx,VW/2-ww/2+wob,598,ww,58,17);
      ctx.fillStyle='#e8862a';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=3;ctx.stroke();
      ctx.font='bold 28px '+FONT;ctx.fillStyle='#fff';
      ctx.fillText('⚠ '+G.warn.msg,VW/2+wob,637);
      ctx.restore();
    }
  }
  if(G.toast&&G.toast.t<2.2){
    var ta=Math.min(1,G.toast.t*4)*Math.min(1,(2.2-G.toast.t)*2);
    ctx.globalAlpha=Math.max(0,ta);
    ctx.font='bold 28px '+FONT;
    var tw=ctx.measureText(G.toast.msg).width+60;
    rr(ctx,VW/2-tw/2,100,tw,58,16);          // 提示条挪到 HUD 下方，别压住棋盘
    ctx.fillStyle='rgba(40,60,80,0.85)';ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillText(G.toast.msg,VW/2,138);
    ctx.globalAlpha=1;
  }
  /* 选档面板是最上层模态：打开时不再叠画结算面板（否则结算面板会把它整块盖住，
     玩家看到「弹窗上多了难度但点不动」） */
  if(G.tierPick)drawTierPanel(time);
  else if(G.state==='win')drawWinPanel(time);
  if(G.lvPick)drawLvPick(time);        // 隐藏选关面板永远在最上层
}

function checkAllGone(){
  var all=true;
  for(var i=0;i<G.bottles.length;i++)if(G.bottles[i].place!=='gone'){all=false;break;}
  if(all)levelDone();
}
/* ---- 通关结算：星级 / 存档 / 连击 / 埋点（V4.0 §18 星级、§19 每日挑战、§21 埋点） ---- */
function unlockNextTier(lv,tier){
  var cur=Store.data.tiers[lv]||0;
  var nx=Math.min(1,tier+1);              // V6.3 两档：通过普通 → 解锁极限（无困难档）
  if(nx>cur)Store.data.tiers[lv]=nx;
  return Store.data.tiers[lv];
}
function saveProgress(){
  try{ Store.save(); }catch(e){}
}
function levelDone(){
  G.state='win'; SFX.win();
  var par=G.par||99;
  /* 星级：3 星=步数达标且没重开；2 星=步数宽松达标；否则 1 星。
     这里**不再要求 0 道具**：par=max(10,round(N*1.4+洞数*2)) 相对理论最小步数 N 有十几步余量，
     三件道具全用也才 +3 步，余量早容纳了；而"用了道具就没三星"会掐死变现 ——
     玩家不敢用道具 → 道具永不耗尽 → 「看广告补次」这条路径永远触发不了。
     !G.restarted 保留（全文唯一的 anti-reroll 门槛）。 */
  var stars=(G.moves<=par&&!G.restarted)?3:(G.moves<=Math.round(par*1.5)?2:1);
  /* 看过广告的都不该拿到三星 —— reviveUsed（整局回到安全局面）与
     adUndo（撤销次数用光、看广告补 1 次再退一步）是同一条原则的两种形态，
     口径必须一致，否则会出现「看完广告 → 三星」这种自相矛盾的激励。
     用普通撤销次数退的那一步不在此列（花的是每关 5 次的额度）。 */
  if((G.reviveUsed>0||G.adUndo>0)&&stars>2)stars=2;
  /* V6.0 §五-A：热身档（负数）在存档里一律记到「普通」那一格 ——
     热身只是「这次重开在哪个难度」，不是一种新的挑战档，
     否则热身通关会凭空点亮「困难/极限」的星，热身就成了刷星捷径。 */
  var recTier=clamp(G.tier|0,0,1);   // V6.3 两档：0=普通 1=极限（无困难）
  var warmInfo=null;
  G.winStats={stars:stars,moves:G.moves,tools:G.toolsUsed,revive:G.reviveUsed,tier:G.tier,
    recTier:recTier,par:par,daily:!!G.daily,warm:G.warm?1:0,warmTier:G.tier};
  var key=String(G.level);
  var rec=Store.data.stars[key]||{normal:0,extreme:0};
  var field=(['normal','extreme'])[recTier]||'normal';
  if((rec[field]||0)<stars)rec[field]=stars;
  Store.data.stars[key]=rec;
  unlockNextTier(G.level,recTier);
  if(!G.daily&&G.level+1>Store.data.level)Store.data.level=Math.min(G.level+1,CFG.maxLevel);  // 通关最后一关后不再溢出到 91+
  Store.data.wins=(Store.data.wins||0)+1;
  if(!G.daily)Store.data.maxLevel=Math.max(Store.data.maxLevel||1,G.level);
  /* ---- 热身推进：通关一次就把档位往上抬一档（热身1 → 热身2 → 正常）----
     放在存档写完之后、saveProgress 之前，保证「档位」和「进度」一起落盘。 ---- */
  if(!G.daily&&G.warm){
    var nt=advanceWarmup();
    if(nt!==null)warmInfo={tier:nt,still:!!(Store.data.warmActive)};
    G.winStats.warmNext=warmInfo;
  }
  if(G.daily){
    Store.data.daily={date:G.dailyDate,done:1,stars:stars,moves:G.moves};
    Track.log('challenge_complete',{date:G.dailyDate,stars:stars,moves:G.moves});
  }
  saveProgress();
  /* 连击 / 低频插屏（P1）：连续成功 3 次才允许一次，且仍受冷却与会话上限约束 */
  G.winStreak=(G.winStreak||0)+1;
  AdService.session.wins=G.winStreak;
  G.interPending=(G.winStreak>=CFG.interstitialAfterWins);
  Track.log('level_complete',{stars:stars,moves:G.moves,tools:G.toolsUsed,tier:G.tier,par:par,
    revives:G.reviveUsed,adUndo:G.adUndo,daily:G.daily?'1':'0'});   // 埋点里分开记，结算面板上只显示「复活 N」
  Track.log('moves',{n:G.moves,par:par});
}
/* ---- 日期键 / 每日挑战（固定种子，每天一个不同配置；V1 不做签到） ---- */
function dateKey(d){
  d=d||new Date();
  var m=d.getMonth()+1,dd=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
function dailySeed(key){ return (Store.hash(key)^0x5f3a7b1)>>>0; }
function dailyDoneToday(){ var d=Store.get('daily',null); return !!(d&&d.date===dateKey()&&d.done); }
function startDaily(){
  var key=dateKey();
  var lv=Math.max(9,Math.min(24,Store.get('level',9)||9));   // 每日挑战取「当前进度附近」的难度
  Track.log('challenge_start',{date:key,seed:dailySeed(key),level:lv});
  genLevel(lv,{seed:dailySeed(key),daily:true,date:key,tier:0,quiet:true});
  toast('每日挑战：'+key+'（每天同一局，全球同题）');
}
/* ---- 会话启动：读档 + first_open / return_open / game_start ---- */
function bootSession(){
  Store.load();
  var today=dateKey();
  var last=Store.get('lastOpen','');
  if(!Store.get('firstOpen','')){ Store.set('firstOpen',today); Track.log('first_open',{date:today}); }
  else if(last&&last!==today){ Track.log('return_open',{from:last,to:today}); }
  Store.set('lastOpen',today);
  Store.set('sessions',(Store.get('sessions',0)||0)+1);
  /* V6.0 §五-A：先判定「这次回来要不要热身」，再刷新 lastPlayed。
     顺序不能反 —— 反了就永远量到 idle=0，热身触发不了。 */
  var warm=warmupOnBoot();
  if(warm)toast('欢迎回来！第 '+warm.level+' 关这次从「'+ (warm.tier<=-2?'热身1':'热身2') +'」开始找手感');
  Track.log('game_start',{level:Store.get('level',1),maxLevel:Store.get('maxLevel',1),
    warm:warm?1:0,warmTier:Store.get('warmTier',0),env:AdService.env});
  G.winStreak=0;
}
/* 单次会话时长：整页生命周期只记一条，避免「切后台又回来」重复计数 */
var _sessionLogged=0;
function logSession(why){
  if(_sessionLogged)return;
  _sessionLogged=1;
  try{ Track.log('session_duration',{sec:Math.round(G.t||0),level:G.level,why:why||''}); }catch(e){}
}
/* ================= 主循环 ================= */
function update(dt){
  G.t+=dt;
  G.dt=dt;
  if(G.toast)G.toast.t+=dt;
  if(G.fail){
    /* 失败面板期间：冻结所有游戏逻辑（只留粒子收尾 + 面板自己的入场动画） */
    G.fail.t+=dt;
    for(var fp=particles.length-1;fp>=0;fp--){
      var fpt=particles[fp];
      fpt.age+=dt;fpt.x+=fpt.vx*dt;fpt.y+=fpt.vy*dt;fpt.vy+=fpt.g*dt;
      if(fpt.age>=fpt.life)particles.splice(fp,1);
    }
    return;
  }
  if(G.tierPick)return;                       // 选档面板同样模态
  /* 新手引导气泡：做出第一个操作或停留 9 秒后自动收起 */
  if(G.tutTip){
    G.tutT=(G.tutT||0)+dt;
    if(G.tutT>9||G.moves>0){ G.tutTip=0; G.tutT=0; }
  }
  if(G.anim){
    var a=G.anim;a.t+=dt;
    if(a.type==='place'||a.type==='return'){
      var p=Math.min(1,a.t/a.dur);
      var arc=-Math.sin(p*Math.PI)*150;
      a.b.x=lerp(a.fx,a.tx,p);
      a.b.y=lerp(a.fy,a.ty,p)+arc;
      if(p>=1){
        a.b.place=(a.type==='place')?'counter':'grid';
        a.b.x=a.tx;a.b.y=a.ty;
        if(a.type==='place'){a.b.capT=0.001;SFX.cap();}
        G.anim=null;
      }
    }else if(a.type==='drink'){
      if(a.t>=a.dur)finishDrink();
    }
  }else{
    tryDrinks();
  }
  // 飞出特效推进
  for(var f=flying.length-1;f>=0;f--){
    flying[f].t+=dt;
    if(flying[f].t>=0.7)flying.splice(f,1);
  }
  // 冰冻瓶：左右两格都空了就自动解冻
  thawByNeighbors();
  checkStuck();
  if(G.warn){G.warn.t+=dt; if(G.warn.t>1.8)G.warn=null;}
  for(var b=0;b<G.bottles.length;b++){
    var bb=G.bottles[b];
    /* V6.4.17:台面瓶capT涨;货架瓶capT回落(撤销回货架后盖子画回来) */
    if(bb.capT>0){if(bb.place==='counter'){if(bb.capT<1)bb.capT=Math.min(1,bb.capT+dt*3.2);}else bb.capT=Math.max(0,bb.capT-dt*3.2);}
    if(bb.done)bb.doneT=(bb.doneT||0)+dt;
    if(bb.shake>0)bb.shake=Math.max(0,bb.shake-dt*2.6);
  }
  for(var t2=0;t2<G.tubes.length;t2++){
    var tt=G.tubes[t2];
    if(tt.drop>0)tt.drop=Math.max(0,tt.drop-dt*3.5);
  }
  for(var p2=particles.length-1;p2>=0;p2--){
    var pt2=particles[p2];
    pt2.age+=dt;pt2.x+=pt2.vx*dt;pt2.y+=pt2.vy*dt;pt2.vy+=pt2.g*dt;
    if(pt2.age>=pt2.life)particles.splice(p2,1);
  }
  /* 成功后低频插屏：V6.4.10 改结算弹窗关闭时才弹。旧版 state==='win' 下一帧就弹、盖在结算面板。现由 closeWinAndInterstitial() 在关闭动作触发。 */
}
var lastTs=0;
var _dumpT=-99999;
function loop(ts){
  try{
    ts=ts||0;
    /* ?dump=1：每秒刷一次埋点面板（节流，别每帧解析 JSON） */
    if(CFG.dumpTrack&&(ts-_dumpT>1000)){ _dumpT=ts; Track.dump(); }
    var dt=Math.min(0.05,(ts-lastTs)/1000||0.016);
    lastTs=ts;
    update(dt);
    render(G.t);
    renderedOk=true;
  }catch(err){
    // 不静默白屏：把崩溃原因画到页面上，便于排查
    if(!fatalShown){fatalShown=true;showFatal('运行中出错：\n'+diagText()+'\n\n'+((err&&err.stack)||err));}
  }
  requestAnimationFrame(loop);
}
function detectNotchSafeArea(){try{var u=navigator.userAgent||'',i=/iPhone|iPad|iPod/.test(u);if(!i&&!/Android/.test(u))return null;var d=window.devicePixelRatio||1,h=(screen&&screen.height&&d)?screen.height/d:0;if(h<680)return null;var t=h>=800;if(i)return t?{t:47,b:34,l:0,r:0}:{t:20,b:0,l:0,r:0};return {t:t?32:24,b:20,l:0,r:0};}catch(e){return null;}}
function readSafeInsets(){var o={t:0,b:0,l:0,r:0};try{var cs=getComputedStyle(document.documentElement);function px(n){var v=parseFloat(cs.getPropertyValue(n));return(v>0&&isFinite(v))?v:0;}o.t=px('--sat');o.b=px('--sab');o.l=px('--sal');o.r=px('--sar');}catch(e){}if(!o.t&&!o.b&&!o.l&&!o.r){var f=detectNotchSafeArea();if(f)o=f;}return o;}
function readViewport(){
  // 只读"视口"来源，绝不读 canvas 自身 —— 否则会被自己设的行内样式污染，形成逐帧放大的自反馈
  var w=0,h=0;
  if(window.innerWidth>0&&window.innerHeight>0){w=window.innerWidth;h=window.innerHeight;}
  if((!(w>0)||!(h>0))&&document.documentElement){w=document.documentElement.clientWidth||0;h=document.documentElement.clientHeight||0;}
  if((!(w>0)||!(h>0))&&document.body){w=document.body.clientWidth||0;h=document.body.clientHeight||0;}
  if((!(w>0)||!(h>0))&&window.visualViewport){w=window.visualViewport.width||0;h=window.visualViewport.height||0;}
  if(!(w>0))w=VW;
  if(!(h>0))h=Math.round(w*VH/VW);
  if(w>4000||w<80)w=VW;      // 异常值兜底
  if(h>4000||h<80)h=VH;
  return {w:Math.round(w),h:Math.round(h)};
}
function resize(){
  var sz=readViewport();
  /* V6.4.17:screen兜底仅限WebView/独立模式;普通浏览器用视口,防canvas高于可视区挡住工具栏 */
  var _sw=(window.screen&&window.screen.width)||0, _sh=(window.screen&&window.screen.height)||0;
  var _ua=navigator.userAgent||'';
  var _wv=(navigator.standalone===true)||/;\s*wv\)/.test(_ua)||/TapTap/i.test(_ua)||!/Safari\//.test(_ua);
  cw=Math.min(4000,Math.max(80,_wv?Math.max(sz.w,_sw):sz.w));
  ch=Math.min(4000,Math.max(80,_wv?Math.max(sz.h,_sh):sz.h));
  dpr=Math.min(window.devicePixelRatio||1,2);
  if(!(dpr>0))dpr=1;
  if(canvas){
    canvas.style.position='fixed';
    canvas.style.left='0px';canvas.style.top='0px';
    canvas.style.width=cw+'px';canvas.style.height=ch+'px';
    canvas.width=Math.round(cw*dpr);
    canvas.height=Math.round(ch*dpr);
  }
  /* V6.4.9: 内容缩进安全区；背景已全屏铺满（V6.4.16） */
  var safe=readSafeInsets();
  var aw=Math.max(80,cw-safe.l-safe.r);
  var ah=Math.max(80,ch-safe.t-safe.b);
  scale=Math.min(aw/VW,ah/VH);
  if(!isFinite(scale)||scale<=0)scale=1;
  offX=safe.l+(aw-VW*scale)/2;
  offY=safe.t+(ah-VH*scale)/2;
  lastSize={cw:cw,ch:ch};
}
if(canvas){
  canvas.addEventListener('mousemove',function(e){var v=toVirtual(e.clientX,e.clientY);tubeHover=tubeAt(v.x,v.y);});
  canvas.addEventListener('mousedown',function(e){handleTap(e.clientX,e.clientY);});
  canvas.addEventListener('touchstart',function(e){if(e.cancelable)e.preventDefault();var t=e.changedTouches[0];if(t)handleTap(t.clientX,t.clientY);},{passive:false});
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);setTimeout(resize,400);setTimeout(resize,900);});
if(window.visualViewport&&window.visualViewport.addEventListener)window.visualViewport.addEventListener('resize',resize);
resize();
// 部分 WebView 首帧拿不到真实尺寸，延迟再校几次
setTimeout(resize,60);setTimeout(resize,300);setTimeout(resize,900);
/* ============ 商业基础设施启动顺序（读档 → 广告环境 → 会话埋点） ============
   任何一步失败都不允许影响游戏：全部 try/catch 包裹 + 内部还有二级兜底。 */
try{ AdService.init(); }catch(e){}
try{ bootSession(); }catch(e){}
try{
  window.addEventListener('pagehide',function(){ logSession('pagehide'); });
  window.addEventListener('beforeunload',function(){ logSession('unload'); });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)logSession('hidden');
  });
}catch(e){}
if(URL_LVL){genLevel(URL_LVL);}
requestAnimationFrame(loop);
/* ============ 启动自检：一旦白屏，把原因直接写在屏幕上 ============ */
try{
  if(/[?&]diag=1/.test((window.location&&window.location.search)||'')){
    setTimeout(function(){showFatal('已按 ?diag=1 输出诊断信息\n'+diagText());},1000);
  }
}catch(e){}
setTimeout(function(){
  try{
    var w=canvas?(canvas.clientWidth||0):0, h=canvas?(canvas.clientHeight||0):0;
    if(!(w>0)||!(h>0))showFatal('画布显示尺寸为 0，游戏无法显示。\n'+diagText()+'\n\n请把这张截图发我。');
  }catch(e){}
},1600);
})();

</script>
