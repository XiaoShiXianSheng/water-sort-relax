<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    width: 1200px;
    height: 1200px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0b609f;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  #stage { width: 1200px; height: 1200px; display: block; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17a2e0"/>
      <stop offset="1" stop-color="#0b609f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fc8f2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6fc8f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0e6fb0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0e6fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a4f86" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#cdeeff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="hiTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bottleInterior">
      <rect x="-44" y="8" width="88" height="544" rx="38" ry="38"/>
    </clipPath>
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#06294a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="1200" fill="url(#bgGrad)"/>

  <circle cx="200" cy="200" r="240" fill="url(#glowA)"/>
  <circle cx="1050" cy="1050" r="280" fill="url(#glowB)"/>
  <circle cx="600" cy="90" r="260" fill="url(#glowC)"/>
  <circle cx="100" cy="760" r="170" fill="url(#glowA)"/>
  <circle cx="1120" cy="320" r="160" fill="url(#glowC)"/>

  <g fill="url(#bubble)">
    <circle cx="160" cy="430" r="26"/>
    <circle cx="230" cy="640" r="15"/>
    <circle cx="90" cy="560" r="11"/>
    <circle cx="1040" cy="280" r="24"/>
    <circle cx="1110" cy="520" r="17"/>
    <circle cx="980" cy="150" r="13"/>
    <circle cx="430" cy="120" r="14"/>
    <circle cx="770" cy="110" r="18"/>
    <circle cx="610" cy="150" r="11"/>
    <circle cx="900" cy="690" r="13"/>
    <circle cx="280" cy="160" r="12"/>
    <circle cx="40" cy="350" r="17"/>
    <circle cx="1170" cy="760" r="15"/>
    <circle cx="520" cy="700" r="10"/>
    <circle cx="700" cy="675" r="11"/>
  </g>

  <rect x="120" y="760" width="960" height="56" rx="28" ry="28" fill="url(#shelfGrad)" stroke="#bfe6ff" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="140" y="767" width="920" height="9" rx="4" ry="4" fill="#ffffff" fill-opacity="0.25"/>

  <!-- 瓶1 cx=200 已完成红 -->
  <g transform="translate(200,200)">
    <rect x="-50" y="0" width="100" height="560" rx="42" ry="42" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-20" y="-42" width="40" height="50" rx="11" ry="11" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-42" rx="20" ry="7" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-44" y="8"   width="88" height="181" fill="#ff5d6c"/>
      <rect x="-44" y="189" width="88" height="181" fill="#ff5d6c"/>
      <rect x="-44" y="370" width="88" height="174" fill="#ff5d6c"/>
      <rect x="-44" y="8"   width="88" height="181" fill="url(#hiTop)"/>
      <rect x="-37" y="18" width="13" height="510" rx="6" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="16" cy="420" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-10" cy="540" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 瓶2 cx=400 混色（蓝→黄→绿，进行中） -->
  <g transform="translate(400,200)">
    <rect x="-50" y="0" width="100" height="560" rx="42" ry="42" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-20" y="-42" width="40" height="50" rx="11" ry="11" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-42" rx="20" ry="7" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-44" y="8"   width="88" height="181" fill="#3f8cff"/>
      <rect x="-44" y="189" width="88" height="181" fill="#ffb648"/>
      <rect x="-44" y="370" width="88" height="174" fill="#3ec46d"/>
      <rect x="-44" y="8"   width="88" height="181" fill="url(#hiTop)"/>
      <rect x="-37" y="18" width="13" height="510" rx="6" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="14" cy="130" r="5" fill="#ffffff" fill-opacity="0.3"/>
      <circle cx="20" cy="470" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-12" cy="280" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
    <path d="M0,-55 C7,-42 7,-35 0,-29 C-7,-35 -7,-42 0,-55 Z" fill="#3f8cff" fill-opacity="0.9"/>
    <ellipse cx="0" cy="-19" rx="4.5" ry="6.5" fill="#3f8cff" fill-opacity="0.7"/>
  </g>

  <!-- 瓶3 cx=600 已完成紫 -->
  <g transform="translate(600,200)">
    <rect x="-50" y="0" width="100" height="560" rx="42" ry="42" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-20" y="-42" width="40" height="50" rx="11" ry="11" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-42" rx="20" ry="7" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-44" y="8"   width="88" height="181" fill="#9b6bf5"/>
      <rect x="-44" y="189" width="88" height="181" fill="#9b6bf5"/>
      <rect x="-44" y="370" width="88" height="174" fill="#9b6bf5"/>
      <rect x="-44" y="8"   width="88" height="181" fill="url(#hiTop)"/>
      <rect x="-37" y="18" width="13" height="510" rx="6" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="16" cy="330" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-8" cy="520" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 瓶4 cx=800 混色（红→粉→绿，进行中） -->
  <g transform="translate(800,200)">
    <rect x="-50" y="0" width="100" height="560" rx="42" ry="42" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-20" y="-42" width="40" height="50" rx="11" ry="11" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-42" rx="20" ry="7" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-44" y="8"   width="88" height="181" fill="#ff5d6c"/>
      <rect x="-44" y="189" width="88" height="181" fill="#ff85c2"/>
      <rect x="-44" y="370" width="88" height="174" fill="#3ec46d"/>
      <rect x="-44" y="8"   width="88" height="181" fill="url(#hiTop)"/>
      <rect x="-37" y="18" width="13" height="510" rx="6" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="18" cy="260" r="5" fill="#ffffff" fill-opacity="0.4"/>
      <circle cx="-14" cy="470" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="10" cy="130" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 瓶5 cx=1000 已完成蓝 -->
  <g transform="translate(1000,200)">
    <rect x="-50" y="0" width="100" height="560" rx="42" ry="42" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-20" y="-42" width="40" height="50" rx="11" ry="11" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-42" rx="20" ry="7" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-44" y="8"   width="88" height="181" fill="#3f8cff"/>
      <rect x="-44" y="189" width="88" height="181" fill="#3f8cff"/>
      <rect x="-44" y="370" width="88" height="174" fill="#3f8cff"/>
      <rect x="-44" y="8"   width="88" height="181" fill="url(#hiTop)"/>
      <rect x="-37" y="18" width="13" height="510" rx="6" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="14" cy="380" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-10" cy="540" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <g stroke="#bfe6ff" stroke-opacity="0.12" fill="none" stroke-width="3">
    <path d="M80,1110 Q400,1085 720,1110 T1360,1110 T1200,1110"/>
    <path d="M0,1145 Q360,1122 720,1145 T1440,1145 T1200,1145"/>
  </g>

  <text x="600" y="1080" text-anchor="middle"
        font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="110" font-weight="700"
        fill="#ffffff" stroke="#06294a" stroke-width="6" paint-order="stroke"
        letter-spacing="6" filter="url(#titleShadow)">解压水消除</text>
</svg>
</body>
</html>
