<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0b609f;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  #stage {
    width: 1920px;
    height: 1080px;
    display: block;
  }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景：深蓝垂直渐变（主色沿用游戏蓝） -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17a2e0"/>
      <stop offset="1" stop-color="#0b609f"/>
    </linearGradient>

    <!-- 柔光斑 -->
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fc8f2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6fc8f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0e6fb0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0e6fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 玻璃瓶身质感 -->
    <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <!-- 货架托盘 -->
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a4f86" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 气泡 -->
    <radialGradient id="bubble" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#cdeeff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </radialGradient>

    <!-- 同色液体高光（顶部更亮） -->
    <linearGradient id="hiTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 每个瓶身内部裁剪，瓶身局部坐标（中心 x=0，瓶身顶 y=0） -->
    <clipPath id="bottleInterior">
      <rect x="-48" y="8" width="96" height="474" rx="40" ry="40"/>
    </clipPath>

    <!-- 文本投影 -->
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06294a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 柔光斑（自然分布，不堆中心） -->
  <circle cx="300" cy="240" r="360" fill="url(#glowA)"/>
  <circle cx="1660" cy="980" r="420" fill="url(#glowB)"/>
  <circle cx="960" cy="120" r="420" fill="url(#glowC)"/>
  <circle cx="150" cy="900" r="260" fill="url(#glowA)"/>
  <circle cx="1780" cy="360" r="240" fill="url(#glowC)"/>

  <!-- 装饰气泡（半透明水珠，散布在四周与上方，避开正中堆叠） -->
  <g fill="url(#bubble)">
    <circle cx="250" cy="430" r="34"/>
    <circle cx="320" cy="640" r="20"/>
    <circle cx="180" cy="560" r="14"/>
    <circle cx="1640" cy="300" r="30"/>
    <circle cx="1720" cy="560" r="22"/>
    <circle cx="1560" cy="180" r="16"/>
    <circle cx="700" cy="120" r="18"/>
    <circle cx="1210" cy="110" r="24"/>
    <circle cx="980" cy="150" r="14"/>
    <circle cx="1430" cy="690" r="16"/>
    <circle cx="430" cy="160" r="15"/>
    <circle cx="60" cy="350" r="22"/>
    <circle cx="1860" cy="760" r="20"/>
    <circle cx="820" cy="700" r="12"/>
    <circle cx="1100" cy="675" r="13"/>
  </g>

  <!-- 货架托盘（圆角，玻璃质感） -->
  <rect x="280" y="700" width="1360" height="64" rx="32" ry="32" fill="url(#shelfGrad)" stroke="#bfe6ff" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="300" y="708" width="1320" height="10" rx="5" ry="5" fill="#ffffff" fill-opacity="0.25"/>

  <!-- ================= 玻璃瓶（核心视觉，画出的游戏画面） ================= -->
  <!-- 瓶身定义（局部坐标，translate 到目标位置） -->
  <!-- 瓶1：cx=460 已完成（全浅蓝） -->
  <g transform="translate(460,210)">
    <rect x="-55" y="0" width="110" height="490" rx="44" ry="44" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-22" y="-45" width="44" height="55" rx="12" ry="12" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-45" rx="22" ry="8" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-48" y="8"   width="96" height="158" fill="#7ddcff"/>
      <rect x="-48" y="166" width="96" height="158" fill="#7ddcff"/>
      <rect x="-48" y="324" width="96" height="158" fill="#7ddcff"/>
      <rect x="-48" y="8" width="96" height="158" fill="url(#hiTop)"/>
      <rect x="-40" y="20" width="14" height="440" rx="7" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="18" cy="380" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-10" cy="500" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 瓶2：cx=710 混色（琥珀→珊瑚→薄荷，进行中） -->
  <g transform="translate(710,210)">
    <rect x="-55" y="0" width="110" height="490" rx="44" ry="44" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-22" y="-45" width="44" height="55" rx="12" ry="12" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-45" rx="22" ry="8" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-48" y="8"   width="96" height="158" fill="#5fd6a8"/>
      <rect x="-48" y="166" width="96" height="158" fill="#ef8a6a"/>
      <rect x="-48" y="324" width="96" height="158" fill="#f8b746"/>
      <rect x="-48" y="8"   width="96" height="158" fill="url(#hiTop)"/>
      <rect x="-40" y="20" width="14" height="440" rx="7" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="14" cy="120" r="5" fill="#ffffff" fill-opacity="0.3"/>
      <circle cx="20" cy="430" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-12" cy="250" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
    <!-- 正在倒水的水滴，体现“分装”玩法 -->
    <path d="M0,-58 C8,-44 8,-36 0,-30 C-8,-36 -8,-44 0,-58 Z" fill="#7ddcff" fill-opacity="0.9"/>
    <ellipse cx="0" cy="-20" rx="5" ry="7" fill="#7ddcff" fill-opacity="0.7"/>
  </g>

  <!-- 瓶3：cx=960 已完成（全紫） -->
  <g transform="translate(960,210)">
    <rect x="-55" y="0" width="110" height="490" rx="44" ry="44" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-22" y="-45" width="44" height="55" rx="12" ry="12" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-45" rx="22" ry="8" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-48" y="8"   width="96" height="158" fill="#a98cff"/>
      <rect x="-48" y="166" width="96" height="158" fill="#a98cff"/>
      <rect x="-48" y="324" width="96" height="158" fill="#a98cff"/>
      <rect x="-48" y="8"   width="96" height="158" fill="url(#hiTop)"/>
      <rect x="-40" y="20" width="14" height="440" rx="7" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="16" cy="300" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-8" cy="480" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 瓶4：cx=1210 混色（薄荷→白→浅蓝，进行中） -->
  <g transform="translate(1210,210)">
    <rect x="-55" y="0" width="110" height="490" rx="44" ry="44" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-22" y="-45" width="44" height="55" rx="12" ry="12" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-45" rx="22" ry="8" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-48" y="8"   width="96" height="158" fill="#7ddcff"/>
      <rect x="-48" y="166" width="96" height="158" fill="#ffffff"/>
      <rect x="-48" y="324" width="96" height="158" fill="#5fd6a8"/>
      <rect x="-48" y="8"   width="96" height="158" fill="url(#hiTop)"/>
      <rect x="-40" y="20" width="14" height="440" rx="7" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="18" cy="240" r="5" fill="#ffffff" fill-opacity="0.4"/>
      <circle cx="-14" cy="430" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="10" cy="120" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 瓶5：cx=1460 已完成（全琥珀黄） -->
  <g transform="translate(1460,210)">
    <rect x="-55" y="0" width="110" height="490" rx="44" ry="44" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="-22" y="-45" width="44" height="55" rx="12" ry="12" fill="url(#glassBody)" stroke="#dff3ff" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="-45" rx="22" ry="8" fill="#0b609f" fill-opacity="0.55"/>
    <g clip-path="url(#bottleInterior)">
      <rect x="-48" y="8"   width="96" height="158" fill="#f8b746"/>
      <rect x="-48" y="166" width="96" height="158" fill="#f8b746"/>
      <rect x="-48" y="324" width="96" height="158" fill="#f8b746"/>
      <rect x="-48" y="8"   width="96" height="158" fill="url(#hiTop)"/>
      <rect x="-40" y="20" width="14" height="440" rx="7" fill="#ffffff" fill-opacity="0.22"/>
      <circle cx="14" cy="350" r="6" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-10" cy="500" r="4" fill="#ffffff" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- 底部轻微波纹（装饰） -->
  <g stroke="#bfe6ff" stroke-opacity="0.12" fill="none" stroke-width="3">
    <path d="M120,1010 Q420,985 720,1010 T1320,1010 T1920,1010"/>
    <path d="M0,1045 Q360,1022 720,1045 T1440,1045 T1920,1045"/>
  </g>

  <!-- 游戏名（唯一可见文本，居中偏下，中等字号，深色描边+投影） -->
  <text x="960" y="930" text-anchor="middle"
        font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="132" font-weight="700"
        fill="#ffffff" stroke="#06294a" stroke-width="7" paint-order="stroke"
        letter-spacing="8" filter="url(#titleShadow)">解压水消除</text>
</svg>
</body>
</html>
